<style>
/* Tide.fm section — Wise design tokens */
.tide-box{
  background:var(--s);
  border:1px solid rgba(14,15,12,.06);
  border-radius:var(--rx);
  padding:var(--sxl);
  margin-bottom:var(--sxl);
}
.tide-box-label{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--m);margin-bottom:var(--sm);display:flex;align-items:center;gap:var(--ss)
}
.tide-row{display:flex;gap:var(--ss)}
.tide-input{
  flex:1;padding:var(--sm) var(--sl);
  border-radius:var(--rm);border:1px solid rgba(14,15,12,.15);
  background:var(--c);color:var(--k);
  font:inherit;font-size:14px;outline:none;transition:border-color .2s
}
.tide-input:focus{border-color:var(--p)}
.tide-input::placeholder{color:var(--m)}
.tide-parse-btn{
  white-space:nowrap;padding:var(--sm) var(--sxl);
  border-radius:var(--rx);border:none;
  background:var(--p);color:var(--op);
  font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:background .2s
}
.tide-parse-btn:hover{background:var(--pa)}

.tide-preview{
  display:flex;gap:var(--sl);margin-top:var(--sl);

  border:1px solid rgba(14,15,12,.06)
}
.tide-cover{
  width:108px;height:108px;border-radius:var(--rm);object-fit:cover;
  flex-shrink:0;background:var(--s)
}
.tide-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--ss)}
.tide-title{
  font-size:15px;font-weight:600;color:var(--k);
  line-height:1.4;margin-bottom:var(--ss);
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical
}
.tide-actions{display:flex;gap:var(--ss);flex-wrap:wrap}
.tide-dl-btn{
  padding:var(--ss) var(--sl);border-radius:var(--rx);
  border:1px solid rgba(14,15,12,.12);
  background:var(--c);color:var(--k);
  font:inherit;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s
}
.tide-dl-btn:hover{background:var(--s);border-color:rgba(14,15,12,.2)}
.tide-dl-btn:disabled{opacity:.4;cursor:not-allowed}
.tide-dl-btn.primary{background:var(--p);color:var(--op);border-color:var(--p);font-weight:600}
.tide-dl-btn.primary:hover{background:var(--pa)}
.tide-status{
  font-size:12px;color:var(--m);margin-top:var(--ss);
  display:flex;align-items:center;gap:var(--ss)
}
.tide-status .spinner{
  width:14px;height:14px;border:2px solid var(--s);border-top-color:var(--p);
  border-radius:50%;animation:spin .6s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.tide-error-box{
  margin-top:var(--ss);padding:var(--ss) var(--sl);
  border-radius:var(--rm);background:var(--nbg);color:var(--neg);
  font-size:13px
}
</style>

<body>
<div class="wrap">

<div class="card">
  <div class="card-hdr">
    <span class="dot"></span>
    <span class="lb">音乐解密</span>
    <span class="rt"><a href="/Music">← 音乐解锁</a></span>
  </div>
  <div class="card-pad">

    <div class="tide-box" id="tideSection">
      <div class="tide-box-label">🌊 潮汐 · Tide.fm</div>
      <div class="tide-row">
        <input type="text" class="tide-input" id="tideUrl" placeholder="粘贴潮汐分享链接…">
        <button class="btn tide-parse-btn" id="tideBtn">解析</button>
      </div>
      <div class="tide-preview" id="tidePreview" style="display:none">
        <img class="tide-cover" id="tideCoverImg">
        <div class="tide-info">
          <div class="tide-title" id="tideTitle"></div>
          <div class="tide-actions">
            <button class="btn tide-dl-btn primary" id="tideDlAudio">下载音频</button>
            <button class="btn tide-dl-btn" id="tideDlCover">下载封面</button>
            <button class="btn tide-dl-btn primary" id="tideDlEmbed">下载 (含封面)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="ic">📂</div>
      <div class="ds">拖拽加密音乐文件到此处</div>
      <div class="ht">或点击选择 · 可多选</div>
      <input type="file" id="fileInput" multiple
        accept=".kgm,.kgma,.kgm.flac,.kgma.flac,.ncm,.qmc0,.qmc2,.qmc3,.qmcflac,.qmcogg,.mflac,.mgg,.mflac0,.mgg1,.tkm,.bkcmp3,.bkcflac,.kwm,.xm,.tm0,.tm2,.tm3,.tm6" hidden>
    </div>

    <div class="fl" id="fl"></div>

    <button class="btn" id="goBtn" disabled>开始解密</button>

    <div class="pg" id="pg">
      <div class="pt" id="pt"></div>
      <div class="pb"><div class="pf" id="pf"></div></div>
    </div>

    <div class="ba" id="ba">
      <a class="dla" id="dlAll">下载zip</a>
      <a class="dla" id="dlBatch">批量下载</a>
    </div>

    <div class="er" id="er"></div>

  </div>
</div>

<div class="card">
  <div class="nt">
    <strong>支持的格式</strong><br>
    🟣 酷狗 KGM · 🟥 网易云 NCM · 🔵 QQ音乐 QMC / MFLAC / MGG<br>
    🟠 酷我 KWM · 🟩 虾米 XM · 🌊 潮汐 Tide.fm (URL)<br>
    • 文件在浏览器本地处理，<strong>不会上传</strong>到任何服务器<br>
    • 仅 KGM 需要从服务器获取密钥段（几十 KB）<br>
    • 解密后自动识别格式，可单独下载 / 打包 zip / 批量下载
  </div>
</div>

</div>

<script>
const WORKER_URL = "worker.js";
const KSS=16;
let workerPool=[];
let callbacks=new Map();
let nextMsgId=0;

// ── 每个任务新建一个 Worker（ee57f4b 方式，速度正常） ──
function getWorker(){
  const w=new Worker(WORKER_URL);
  const idx=workerPool.length;
  w._idx=idx;
  w.onmessage=function(ev){
    const msg=ev.data;
    if(msg.type==='ready'){console.log('[Worker]',idx,'就绪');return}
    const cb=callbacks.get(msg.id);
    if(cb){callbacks.delete(msg.id);if(msg.success) cb.resolve(msg);else cb.reject(new Error(msg.error||'解密失败'))}
    else console.warn('[Worker]',idx,'未知 msg id:',msg.id);
  };
  w.onerror=function(ev){
    console.error('[Worker]',idx,'错误:',ev.message);
    const cb=callbacks.get(w._currentId);
    if(cb){callbacks.delete(w._currentId);cb.reject(new Error('Worker '+idx+' 错误: '+ev.message))}
  };
  workerPool.push(w);
  return w;
}

function runInWorker(arrayBuffer,format,fileName,extra){
  return new Promise((resolve,reject)=>{
    const id=++nextMsgId;
    callbacks.set(id,{resolve,reject});
    const w=getWorker();
    w._currentId=id;
    const msg={id,arrayBuffer,format,fileName,origin:location.origin};
    const transfer=[arrayBuffer];
    if(extra&&extra.keyData){msg.keyData=extra.keyData;transfer.push(extra.keyData)}
    console.log('[Dispatch]',fileName,'→ Worker',w._idx,'id:',id);
    w.postMessage(msg,transfer);
  });
}

// ── KGM 密钥：API 一次获取全部所需密钥段 → 内存缓存 ──
let _kgmKey=null;

async function getKugouKey(fileBuffers){
  if(_kgmKey) return _kgmKey;
  let maxSn=0;
  for(let i=0;i<fileBuffers.length;i++){
    if(files[i].fmt==='kgm'){
      const al=fileBuffers[i].byteLength-1024;
      const sn=Math.ceil(al/KSS);
      if(sn>maxSn) maxSn=sn;
    }
  }
  if(maxSn===0) return null;
  pt.textContent='获取 KGM 密钥…('+maxSn+' bytes)';
  const resp=await fetch('/api/decrypt-key?slots=0&count='+maxSn);
  if(!resp.ok) throw new Error('密钥获取失败');
  _kgmKey=new Uint8Array(await resp.arrayBuffer());
  console.log('[KGM] 密钥已获取:',_kgmKey.length,'bytes');
  return _kgmKey;
}

function getKgmKeySlice(fileByteLength){
  if(!_kgmKey) return null;
  const al=fileByteLength-1024;
  const sn=Math.ceil(al/KSS);
  const len=Math.min(sn,_kgmKey.length);
  return _kgmKey.slice(0,len).buffer;
}

// ── DOM ──
const $=s=>document.querySelector(s);
const dz=$('#dropZone'),fi=$('#fileInput'),fl=$('#fl'),go=$('#goBtn');
const pg=$('#pg'),pt=$('#pt'),pf=$('#pf'),er=$('#er');
const ba=$('#ba'),dlAll=$('#dlAll'),dlBatch=$('#dlBatch');
let files=[];
let isDecrypting=false;

dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');addFiles(e.dataTransfer.files)};
fi.onchange=()=>{if(fi.files.length)addFiles(fi.files);fi.value=''};
go.onclick=decryptAll;

fl.onclick=e=>{
  const dl=e.target.closest('.dl');
  if(dl&&dl.classList.contains('ok')){const idx=parseInt(dl.dataset.idx);if(files[idx]&&files[idx].url) saveFile(files[idx].url,files[idx].dlName);return}
  const rm=e.target.closest('.rm');
  if(rm&&!isDecrypting){removeFile(parseInt(rm.dataset.rm))}
};

dlBatch.onclick=function(e){
  e.preventDefault();
  const done=files.filter(f=>f.status==='done');
  if(!done.length) return;
  dlBatch.textContent='批量下载中…';
  dlBatch.style.pointerEvents='none';
  let delay=0;
  for(const f of done){
    if(f.url){
      setTimeout(()=>{
        const a=document.createElement('a');
        a.href=f.url;a.download=f.dlName||'download';
        document.body.appendChild(a);a.click();
        setTimeout(()=>document.body.removeChild(a),2000);
      },delay);
      delay+=400;
    }
  }
  setTimeout(()=>{
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  },delay+1000);
};

function saveFile(url,name){
  const a=document.createElement('a');a.href=url;a.download=name||'download';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},120000)
}

function addFiles(list){
  if(isDecrypting) return;
  let added=0;
  for(const f of list){
    const fmt=detectFormat(f.name);
    if(!fmt) continue;
    files.push({file:f,name:f.name,size:f.size,status:'pending',blob:null,url:null,err:null,fmt});
    added++;
  }
  if(added<list.length) errMsg('已跳过 '+(list.length-added)+' 个不支持的格式');
  renderList();
  go.disabled=files.length===0;
  er.classList.remove('show');
  ba.classList.remove('show');
}

function renderList(){
  if(!files.length){fl.classList.remove('show');return}
  fl.classList.add('show');
  fl.innerHTML=files.map((f,i)=>{
    const stCls=f.status==='done'?'dn':f.status==='err'?'er':'pd';
    const stSym=f.status==='done'?'✓':f.status==='err'?'!':'';
    const dlCls=f.status==='done'?'ok':'';
    const fmtCls=getFormatColor(f.fmt);
    const fmtLb=getFormatLabel(f.fmt);
    const szTxt=f.status==='done'?sz(f.blob.size):f.status==='err'?f.err:f.status==='processing'?'处理中…':sz(f.size);
    return `<div class="fi" data-i="${i}">
      <span class="st ${stCls}">${stSym}</span>
      <span class="tag ${fmtCls}">${fmtLb}</span>
      <span class="nm">${f.name}</span>
      <span class="sz">${szTxt}</span>
      <a class="dl ${dlCls}" data-idx="${i}">下载</a>
      <span class="rm" data-rm="${i}">✕</span>
    </div>`;
  }).join('');
  const allDone=files.length>0&&files.every(f=>f.status==='done');
  ba.classList.toggle('show',allDone);
}

function detectFormat(name){
  const n=name.toLowerCase();
  if(/\.kgm(\.(flac|mp3))?$|\.kgma/i.test(n)) return 'kgm';
  if(/\.ncm$/i.test(n)) return 'ncm';
  if(/\.qmc0$/i.test(n)) return 'qmc';
  if(/\.qmc2$/i.test(n)) return 'qmc';
  if(/\.qmc3$/i.test(n)) return 'qmc';
  if(/\.qmcflac$/i.test(n)) return 'qmc';
  if(/\.qmcogg$/i.test(n)) return 'qmc';
  if(/\.mflac\d?$/i.test(n)) return 'qmc';
  if(/\.mgg\d?$/i.test(n)) return 'qmc';
  if(/\.tkm$/i.test(n)) return 'qmc';
  if(/\.bkcmp3$|\.bkcflac$/i.test(n)) return 'qmc';
  if(/\.666c6163$|\.6d7033$|\.6f6767$|\.6d3461$|\.776176$/i.test(n)) return 'qmc';
  if(/\.kwm$/i.test(n)) return 'kwm';
  if(/\.xm$/i.test(n)) return 'xm';
  if(/\.tm[0236]$/i.test(n)) return 'raw';
  return null;
}

function getFormatColor(fmt){
  return {kgm:'kgm',ncm:'ncm',qmc:'qmc',kwm:'kwm',xm:'xm',raw:'raw'}[fmt]||'';
}
function getFormatLabel(fmt){
  return {kgm:'KGM',ncm:'NCM',qmc:'QMC',kwm:'KWM',xm:'XM',raw:'RAW'}[fmt]||fmt;
}
function sz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

window.removeFile=function(i){
  if(isDecrypting) return;
  if(files[i]&&files[i].url) URL.revokeObjectURL(files[i].url);
  files.splice(i,1);
  renderList();
  go.disabled=files.length===0;
};

// ── 并行解密 ──
async function decryptAll(){
  if(!files.length||isDecrypting) return;
  isDecrypting=true;
  er.classList.remove('show');ba.classList.remove('show');
  go.disabled=true;pg.classList.add('show');

  for(let i=0;i<files.length;i++) if(files[i].status!=='done'){files[i].status='pending';files[i].blob=null;files[i].url=null;files[i].err=null}
  renderList();

  const total=files.length;
  let doneCount=0,errCount=0;

  // Phase 1: 并行读取所有文件
  pt.textContent='读取文件中…';
  pf.style.width='10%';
  let fileBuffers;
  try{
    fileBuffers=await Promise.all(files.map(f=>f.file.arrayBuffer()));
  }catch(e){
    errMsg('读取文件失败: '+e.message);
    isDecrypting=false;go.disabled=false;pg.classList.remove('show');
    return;
  }

  // Phase 2: 标记所有文件为「处理中」
  for(let i=0;i<total;i++) files[i].status='processing';
  renderList();
  pf.style.width='20%';
  pt.textContent='解密中 0/'+total;

  // Phase 2.5: 如有 KGM 文件，一次 API 获取全部密钥
  const hasKgm=files.some(f=>f.fmt==='kgm');
  if(hasKgm){
    try{
      await getKugouKey(fileBuffers);
    }catch(e){
      console.warn('[KGM] 密钥获取失败，各 Worker 将独立请求:', e.message);
    }
    pf.style.width='20%';
    pt.textContent='解密中 0/'+total;
  }

  // Phase 3: 每文件新建 Worker 并发解密
  let completed=0;
  const workerPromises=fileBuffers.map((buf,i)=>{
    const extra={};
    if(files[i].fmt==='kgm'){
      const slice=getKgmKeySlice(buf.byteLength);
      if(slice) extra.keyData=slice;
    }
    files[i]._t0=Date.now();
    return runInWorker(buf,files[i].fmt,files[i].name,extra)
      .then(msg=>{
        const f=files[i];
        const decBytes=new Uint8Array(msg.result);
        f.blob=new Blob([decBytes],{type:msg.audioMime||'application/octet-stream'});
        f.url=URL.createObjectURL(f.blob);
        f.dlName=msg.dlName||f.name;
        f.status='done';
        doneCount++;
      })
      .catch(err=>{
        files[i].status='err';
        files[i].err=err.message||'解密异常';
        errCount++;
      })
      .finally(()=>{
        completed++;
        renderList();
        pf.style.width=(20+(completed/total*80))+'%';
        pt.textContent='已完成 '+doneCount+'/'+total+' 文件'+(errCount>0?', 失败 '+errCount:'')+(completed<total?', 解密中 '+(total-completed)+' 个':'');
      })
  });

  await Promise.all(workerPromises);

  isDecrypting=false;
  go.disabled=false;pg.classList.remove('show');

  const done=files.filter(f=>f.status==='done');
  if(done.length>0){
    ba.classList.add('show');
    if(done.length===1){
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.onclick=e=>{e.preventDefault();saveFile(done[0].url,done[0].dlName)};
    }else{
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.download='';
      dlAll.onclick=async(e)=>{
        e.preventDefault();
        dlAll.textContent='打包中…';
        const JSZip=await new Promise(r=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          s.onload=()=>r(window.JSZip);document.head.appendChild(s);
        });
        const zip=new JSZip();
        for(const f of done) zip.file(f.dlName,f.blob);
        const blob=await zip.generateAsync({type:'blob'});
        const u=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=u;a.download='decrypted.zip';a.click();
        setTimeout(()=>URL.revokeObjectURL(u),60000);
        dlAll.textContent='下载zip';
      };
    }
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  }
  if(errCount>0) errMsg(errCount+' 个文件解密失败，请查看列表中的错误信息');
}

function errMsg(m){er.textContent='❌ '+m;er.classList.add('show')}

// ════════════════════════════════════════════════════════
// Tide.fm 支持
// ════════════════════════════════════════════════════════
// Tide.fm — Worker-based metadata embedding
// ════════════════════════════════════════════════════════
const tideUrl=$('#tideUrl'),tideBtn=$('#tideBtn'),tidePreview=$('#tidePreview');
const tideCoverImg=$('#tideCoverImg'),tideTitle=$('#tideTitle');
const tideDlAudio=$('#tideDlAudio'),tideDlCover=$('#tideDlCover'),tideDlEmbed=$('#tideDlEmbed');
let tideData=null;
let tideWorker=null;
let tideWorkerId=0;
let tideWorkerCallbacks=new Map();

function getTideWorker(){
  if(tideWorker) return tideWorker;
  tideWorker=new Worker('tide-worker.js');
  tideWorker.onmessage=function(e){
    const msg=e.data;
    const cb=tideWorkerCallbacks.get(msg.id);
    if(cb){
      tideWorkerCallbacks.delete(msg.id);
      if(msg.error) cb.reject(new Error(msg.error));
      else cb.resolve(msg);
    }
  };
  tideWorker.onerror=function(e){
    console.error('[TideWorker]',e.message);
    tideWorkerCallbacks.forEach((cb)=>cb.reject(new Error('Worker error')));
    tideWorkerCallbacks.clear();
    tideWorker=null;
  };
  return tideWorker;
}

function runTideWorkerTask(audio,cover,title){
  return new Promise((resolve,reject)=>{
    const id=++tideWorkerId;
    tideWorkerCallbacks.set(id,{resolve,reject});
    const w=getTideWorker();
    const transfer=[audio];
    if(cover) transfer.push(cover);
    w.postMessage({id,audio,cover,title},transfer);
  });
}

// Show/hide tide status
function showTideStatus(msg){
  let el=document.getElementById('tideStatus');
  if(!el){el=document.createElement('div');el.id='tideStatus';el.className='tide-status';
    tidePreview.parentNode.insertBefore(el,tidePreview.nextSibling)}
  el.innerHTML='<span class="spinner"></span> '+msg;el.style.display='flex';
}
function hideTideStatus(){
  const el=document.getElementById('tideStatus');if(el)el.style.display='none';
}
function showTideError(msg){
  hideTideStatus();
  let el=document.getElementById('tideError');
  if(!el){el=document.createElement('div');el.id='tideError';el.className='tide-error-box';
    tidePreview.parentNode.insertBefore(el,tidePreview.nextSibling)}
  el.textContent=msg;el.style.display='block';
}
function hideTideError(){
  const el=document.getElementById('tideError');if(el)el.style.display='none';
}

// Proxy URL helper
function proxyUrl(raw){return location.origin+'/api/tide-parse?proxy='+encodeURIComponent(raw)}

// Parse tide URL
tideBtn.onclick=async function(){
  const url=tideUrl.value.trim();
  if(!url||!url.includes('tide.fm')){showTideError('请输入有效的潮汐链接');return}
  tideBtn.disabled=true;tideBtn.textContent='解析中…';
  hideTideError();
  try{
    const resp=await fetch('/api/tide-parse',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})
    });
    const data=await resp.json();
    if(!resp.ok||data.error) throw new Error(data.error||'解析失败');
    tideData=data;
    tideTitle.textContent=data.title||'未知标题';
    tideCoverImg.src=data.cover||'';
    tideCoverImg.style.display=data.cover?'block':'none';
    tidePreview.style.display='flex';
    console.log('[Tide] parsed:',data);
  }catch(e){showTideError(e.message)}
  finally{tideBtn.disabled=false;tideBtn.textContent='解析'}
};
tideUrl.onkeydown=e=>{if(e.key==='Enter')tideBtn.click()};

// Download audio — direct browser download (no memory buffer)
tideDlAudio.onclick=function(){
  if(!tideData||!tideData.audio) return;
  hideTideError();
  const a=document.createElement('a');
  a.href=proxyUrl(tideData.audio);
  a.download=(tideData.title||'tide_audio')+'.m4a';
  document.body.appendChild(a);a.click();
  setTimeout(()=>document.body.removeChild(a),2000);
};

// Download cover — direct browser download
tideDlCover.onclick=function(){
  if(!tideData||!tideData.cover) return;
  hideTideError();
  const a=document.createElement('a');
  a.href=proxyUrl(tideData.cover);
  a.download=(tideData.title||'tide_cover')+'.jpg';
  document.body.appendChild(a);a.click();
  setTimeout(()=>document.body.removeChild(a),2000);
};

// Download with embedded cover+title (parallel fetch → Worker embed)
tideDlEmbed.onclick=async function(){
  if(!tideData||!tideData.audio) return;
  tideDlEmbed.textContent='处理中…';tideDlEmbed.disabled=true;
  hideTideError();
  try{
    showTideStatus('并行获取音频和封面…');
    // Parallel fetch audio + cover
    const [audioResp,coverResp]=await Promise.all([
      fetch(proxyUrl(tideData.audio)),
      tideData.cover ? fetch(proxyUrl(tideData.cover)) : Promise.resolve(null)
    ]);
    if(!audioResp.ok) throw new Error('音频获取失败: '+audioResp.status);
    const [audioBuf,coverBuf]=await Promise.all([
      audioResp.arrayBuffer(),
      coverResp&&coverResp.ok ? coverResp.arrayBuffer() : Promise.resolve(null)
    ]);

    showTideStatus('Worker 嵌入元数据…');
    // Offload to Web Worker (non-blocking)
    const result=await runTideWorkerTask(audioBuf,coverBuf,tideData.title);

    showTideStatus('保存文件…');
    const blob=new Blob([result.result],{type:result.mime});
    saveFile(URL.createObjectURL(blob),(tideData.title||'tide_audio')+'.'+result.ext);
    hideTideStatus();
    console.log('[Tide] embedded:',result.ext);
  }catch(e){showTideError('处理失败: '+e.message);console.error('[Tide]',e)}
  finally{tideDlEmbed.textContent='下载 (含封面)';tideDlEmbed.disabled=false;hideTideStatus()}
};
</script>
