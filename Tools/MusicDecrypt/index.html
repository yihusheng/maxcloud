<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐解密 — Wise</title>
<meta name="description" content="在浏览器端解密多种加密音乐格式，不上传文件，保护隐私">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&" rel="stylesheet">
<link rel="stylesheet" href="/style/wise.css">
</head>
<body>
<div class="wrap">

<div class="card">
  <div class="card-hdr">
    <span class="dot"></span>
    <span class="lb">音乐解密</span>
    <span class="rt"><a href="/Music">← 音乐解锁</a></span>
  </div>
  <div class="card-pad">

    <div class="drop-zone" id="dropZone">
      <div class="ic">📂</div>
      <div class="ds">拖拽加密音乐文件到此处</div>
      <div class="ht">或点击选择 · 可多选</div>
      <input type="file" id="fileInput" multiple
        accept=".kgm,.kgma,.kgm.flac,.kgma.flac,.ncm,.qmc0,.qmc2,.qmc3,.qmcflac,.qmcogg,.mflac,.mgg,.mflac0,.mgg1,.tkm,.bkcmp3,.bkcflac,.kwm,.xm,.tm0,.tm2,.tm3,.tm6" hidden>
    </div>

    <div class="fl" id="fl"></div>

    <button class="btn" id="goBtn" disabled>开始解密</button>

    <div class="pg" id="pg">
      <div class="pt" id="pt"></div>
      <div class="pb"><div class="pf" id="pf"></div></div>
    </div>

    <div class="ba" id="ba">
      <a class="dla" id="dlAll">下载zip</a>
      <a class="dla" id="dlBatch">批量下载</a>
    </div>

    <div class="er" id="er"></div>

  </div>
</div>

<div class="card">
  <div class="nt">
    <strong>支持的格式</strong><br>
    🟣 酷狗 KGM · 🟥 网易云 NCM · 🔵 QQ音乐 QMC / MFLAC / MGG<br>
    🟠 酷我 KWM · 🟩 虾米 XM<br>
    • 文件在浏览器本地处理，<strong>不会上传</strong>到任何服务器<br>
    • 仅 KGM 需要从服务器获取密钥段（几十 KB）<br>
    • 解密后自动识别格式，可单独下载 / 打包 zip / 批量下载
  </div>
</div>

</div>

<script>
// Worker 逻辑在独立的 worker.js 中
const WORKER_URL = "worker.js";

// ── Worker 池：页面加载时预创建 4 个 Worker ──
const POOL_SIZE=4;
const KSS=16; // KGM 密钥段大小，与 worker.js 一致
let workerPool=[];
let callbacks=new Map();
let nextMsgId=0;

function initWorkerPool(){
  for(let i=0;i<POOL_SIZE;i++){
    const w=new Worker(WORKER_URL);
    w._busy=false;  // 标记是否正在处理
    w._id=i;
    w.onmessage=function(ev){
      const msg=ev.data;
      if(msg.type==='ready') return; // Worker 就绪信号
      const cb=callbacks.get(msg.id);
      if(cb){
        callbacks.delete(msg.id);
        if(msg.success) cb.resolve(msg);
        else cb.reject(new Error(msg.error||'解密失败'));
      }
      w._busy=false;
    };
    w.onerror=function(ev){
      // Worker 出错时 reject 当前任务并重建
      const cb=callbacks.get(w._currentId);
      if(cb){callbacks.delete(w._currentId);cb.reject(new Error('Worker '+w._id+' 错误: '+ev.message))}
      w._busy=false;
    };
    workerPool.push(w);
  }
}
initWorkerPool();

// ── KGM 密钥：下载 xz → 浏览器解压 → 内存缓存 ──
let _kgmKey=null; // 解压后的完整密钥 (Uint8Array)
let _lzmaLib=null;

async function loadLzmaLib(){
  if(_lzmaLib) return _lzmaLib;
  // 动态加载 LZMA-JS (纯 JS XZ/LZMA 解压器)
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/LZMA-JS/2.1.3/lzma.js';
    s.onload=resolve;
    s.onerror=()=>reject(new Error('LZMA 库加载失败'));
    document.head.appendChild(s);
  });
  _lzmaLib=window.LZMA;
  return _lzmaLib;
}

async function getKugouKey(){
  if(_kgmKey) return _kgmKey;
  // 下载 xz 文件 (92KB)
  const resp=await fetch('kugou_key.xz');
  if(!resp.ok) throw new Error('密钥文件下载失败');
  const compressed=new Uint8Array(await resp.arrayBuffer());
  // 加载 LZMA 库并解压
  const LZMA=await loadLzmaLib();
  const decompressed=await new Promise((resolve,reject)=>{
    LZMA.decompress(compressed,function(result,error){
      if(error) reject(new Error('密钥解压失败'));
      else resolve(result);
    });
  });
  _kgmKey=decompressed;
  console.log('[KGM] 密钥已加载,',(_kgmKey.length/1048576).toFixed(1),'MB');
  return _kgmKey;
}

function getKgmKeySlice(fileByteLength){
  const al=fileByteLength-1024; // HL=1024
  const sn=Math.ceil(al/KSS);
  if(!_kgmKey) return null;
  const len=Math.min(sn,_kgmKey.length);
  return _kgmKey.slice(0,len).buffer; // 复制为 ArrayBuffer 用于 transfer
}

function runInWorker(arrayBuffer,format,fileName,extra){
  return new Promise((resolve,reject)=>{
    const id=++nextMsgId;
    callbacks.set(id,{resolve,reject});
    let w=workerPool.find(w=>!w._busy);
    if(!w) w=workerPool[0];
    w._busy=true;
    w._currentId=id;
    const msg={id,arrayBuffer,format,fileName,origin:location.origin};
    const transfer=[arrayBuffer];
    if(extra&&extra.keyData){msg.keyData=extra.keyData;transfer.push(extra.keyData)}
    w.postMessage(msg,transfer);
  });
}

// ── DOM ──
const $=s=>document.querySelector(s);
const dz=$('#dropZone'),fi=$('#fileInput'),fl=$('#fl'),go=$('#goBtn');
const pg=$('#pg'),pt=$('#pt'),pf=$('#pf'),er=$('#er');
const ba=$('#ba'),dlAll=$('#dlAll'),dlBatch=$('#dlBatch');
let files=[];
let isDecrypting=false;

dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');addFiles(e.dataTransfer.files)};
fi.onchange=()=>{if(fi.files.length)addFiles(fi.files);fi.value=''};
go.onclick=decryptAll;

fl.onclick=e=>{
  const dl=e.target.closest('.dl');
  if(dl&&dl.classList.contains('ok')){const idx=parseInt(dl.dataset.idx);if(files[idx]&&files[idx].url) saveFile(files[idx].url,files[idx].dlName);return}
  const rm=e.target.closest('.rm');
  if(rm&&!isDecrypting){removeFile(parseInt(rm.dataset.rm))}
};

dlBatch.onclick=function(e){
  e.preventDefault();
  const done=files.filter(f=>f.status==='done');
  if(!done.length) return;
  dlBatch.textContent='批量下载中…';
  dlBatch.style.pointerEvents='none';
  let delay=0;
  for(const f of done){
    if(f.url){
      setTimeout(()=>{
        const a=document.createElement('a');
        a.href=f.url;a.download=f.dlName||'download';
        document.body.appendChild(a);a.click();
        setTimeout(()=>document.body.removeChild(a),2000);
      },delay);
      delay+=400;
    }
  }
  setTimeout(()=>{
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  },delay+1000);
};

function saveFile(url,name){
  const a=document.createElement('a');a.href=url;a.download=name||'download';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},120000)
}

function addFiles(list){
  if(isDecrypting) return;
  let added=0;
  for(const f of list){
    const fmt=detectFormat(f.name);
    if(!fmt) continue;
    files.push({file:f,name:f.name,size:f.size,status:'pending',blob:null,url:null,err:null,fmt});
    added++;
  }
  if(added<list.length) errMsg('已跳过 '+(list.length-added)+' 个不支持的格式');
  renderList();
  go.disabled=files.length===0;
  er.classList.remove('show');
  ba.classList.remove('show');
}

function renderList(){
  if(!files.length){fl.classList.remove('show');return}
  fl.classList.add('show');
  fl.innerHTML=files.map((f,i)=>{
    const stCls=f.status==='done'?'dn':f.status==='err'?'er':'pd';
    const stSym=f.status==='done'?'✓':f.status==='err'?'!':'';
    const dlCls=f.status==='done'?'ok':'';
    const fmtCls=getFormatColor(f.fmt);
    const fmtLb=getFormatLabel(f.fmt);
    const szTxt=f.status==='done'?sz(f.blob.size):f.status==='err'?f.err:f.status==='processing'?'处理中…':sz(f.size);
    return `<div class="fi" data-i="${i}">
      <span class="st ${stCls}">${stSym}</span>
      <span class="tag ${fmtCls}">${fmtLb}</span>
      <span class="nm">${f.name}</span>
      <span class="sz">${szTxt}</span>
      <a class="dl ${dlCls}" data-idx="${i}">下载</a>
      <span class="rm" data-rm="${i}">✕</span>
    </div>`;
  }).join('');
  const allDone=files.length>0&&files.every(f=>f.status==='done');
  ba.classList.toggle('show',allDone);
}

function detectFormat(name){
  const n=name.toLowerCase();
  if(/\.kgm(\.(flac|mp3))?$|\.kgma/i.test(n)) return 'kgm';
  if(/\.ncm$/i.test(n)) return 'ncm';
  if(/\.qmc0$/i.test(n)) return 'qmc';
  if(/\.qmc2$/i.test(n)) return 'qmc';
  if(/\.qmc3$/i.test(n)) return 'qmc';
  if(/\.qmcflac$/i.test(n)) return 'qmc';
  if(/\.qmcogg$/i.test(n)) return 'qmc';
  if(/\.mflac\d?$/i.test(n)) return 'qmc';
  if(/\.mgg\d?$/i.test(n)) return 'qmc';
  if(/\.tkm$/i.test(n)) return 'qmc';
  if(/\.bkcmp3$|\.bkcflac$/i.test(n)) return 'qmc';
  if(/\.666c6163$|\.6d7033$|\.6f6767$|\.6d3461$|\.776176$/i.test(n)) return 'qmc';
  if(/\.kwm$/i.test(n)) return 'kwm';
  if(/\.xm$/i.test(n)) return 'xm';
  if(/\.tm[0236]$/i.test(n)) return 'raw';
  return null;
}

function getFormatColor(fmt){
  return {kgm:'kgm',ncm:'ncm',qmc:'qmc',kwm:'kwm',xm:'xm',raw:'raw'}[fmt]||'';
}
function getFormatLabel(fmt){
  return {kgm:'KGM',ncm:'NCM',qmc:'QMC',kwm:'KWM',xm:'XM',raw:'RAW'}[fmt]||fmt;
}
function sz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

window.removeFile=function(i){
  if(isDecrypting) return;
  if(files[i]&&files[i].url) URL.revokeObjectURL(files[i].url);
  files.splice(i,1);
  renderList();
  go.disabled=files.length===0;
};

// ── 并行解密 ──
async function decryptAll(){
  if(!files.length||isDecrypting) return;
  isDecrypting=true;
  er.classList.remove('show');ba.classList.remove('show');
  go.disabled=true;pg.classList.add('show');

  for(let i=0;i<files.length;i++) if(files[i].status!=='done'){files[i].status='pending';files[i].blob=null;files[i].url=null;files[i].err=null}
  renderList();

  const total=files.length;
  let doneCount=0,errCount=0;

  // Phase 1: 并行读取所有文件
  pt.textContent='读取文件中…';
  pf.style.width='10%';
  let fileBuffers;
  try{
    fileBuffers=await Promise.all(files.map(f=>f.file.arrayBuffer()));
  }catch(e){
    errMsg('读取文件失败: '+e.message);
    isDecrypting=false;go.disabled=false;pg.classList.remove('show');
    return;
  }

  // Phase 2: 标记所有文件为「处理中」
  for(let i=0;i<total;i++) files[i].status='processing';
  renderList();
  pf.style.width='20%';
  pt.textContent='解密中 0/'+total;

  // Phase 2.5: 如有 KGM 文件，预加载密钥（仅一次，后续 KGM 文件命中缓存）
  const hasKgm=files.some(f=>f.fmt==='kgm');
  if(hasKgm){
    pt.textContent='加载 KGM 密钥…';
    pf.style.width='15%';
    try{
      await getKugouKey(); // 预加载并缓存
    }catch(e){
      console.warn('[KGM] 本地密钥加载失败，回退 API:', e.message);
    }
    pf.style.width='20%';
    pt.textContent='解密中 0/'+total;
  }

  // Phase 3: 同时派给所有 Worker
  let completed=0;
  const workerPromises=fileBuffers.map((buf,i)=>{
    const extra={};
    if(files[i].fmt==='kgm'){
      const slice=getKgmKeySlice(buf.byteLength);
      if(slice) extra.keyData=slice;
    }
    return runInWorker(buf,files[i].fmt,files[i].name,extra)
      .then(msg=>{
        const f=files[i];
        const decBytes=new Uint8Array(msg.result);
        f.blob=new Blob([decBytes],{type:msg.audioMime||'application/octet-stream'});
        f.url=URL.createObjectURL(f.blob);
        f.dlName=msg.dlName||f.name;
        f.status='done';
        doneCount++;
      })
      .catch(err=>{
        files[i].status='err';
        files[i].err=err.message||'解密异常';
        errCount++;
      })
      .finally(()=>{
        completed++;
        renderList();
        pf.style.width=(20+(completed/total*80))+'%';
        pt.textContent='已完成 '+doneCount+'/'+total+' 文件'+(errCount>0?', 失败 '+errCount:'')+(completed<total?', 解密中 '+(total-completed)+' 个':'');
      })
  );

  await Promise.all(workerPromises);

  for(const w of idleWorkers){w.terminate();w._terminated=true}
  idleWorkers=[];

  isDecrypting=false;
  go.disabled=false;pg.classList.remove('show');

  const done=files.filter(f=>f.status==='done');
  if(done.length>0){
    ba.classList.add('show');
    if(done.length===1){
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.onclick=e=>{e.preventDefault();saveFile(done[0].url,done[0].dlName)};
    }else{
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.download='';
      dlAll.onclick=async(e)=>{
        e.preventDefault();
        dlAll.textContent='打包中…';
        const JSZip=await new Promise(r=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          s.onload=()=>r(window.JSZip);document.head.appendChild(s);
        });
        const zip=new JSZip();
        for(const f of done) zip.file(f.dlName,f.blob);
        const blob=await zip.generateAsync({type:'blob'});
        const u=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=u;a.download='decrypted.zip';a.click();
        setTimeout(()=>URL.revokeObjectURL(u),60000);
        dlAll.textContent='下载zip';
      };
    }
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  }
  if(errCount>0) errMsg(errCount+' 个文件解密失败，请查看列表中的错误信息');
}

function errMsg(m){er.textContent='❌ '+m;er.classList.add('show')}
</script>
</body>
</html>
