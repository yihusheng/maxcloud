<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐解密 — Wise</title>
<meta name="description" content="在浏览器端解密多种加密音乐格式，不上传文件，保护隐私">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&" rel="stylesheet">
<link rel="stylesheet" href="/style/wise.css">
<style>
/* Tide.fm section */
.tide-section{margin-bottom:16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px;background:rgba(255,255,255,.03)}
.tide-row{display:flex;gap:8px}
.tide-input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:#eee;font-size:14px;outline:none;transition:border-color .2s}
.tide-input:focus{border-color:rgba(100,200,160,.5)}
.tide-input::placeholder{color:rgba(255,255,255,.3)}
.tide-btn{white-space:nowrap;padding:10px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#3aa87a,#2d8a63);color:#fff;font-weight:600;cursor:pointer;font-size:14px;transition:opacity .2s}
.tide-btn:hover{opacity:.85}

.tide-preview{display:flex;gap:14px;margin-top:12px;align-items:flex-start}

.tide-dl-btn:hover{background:rgba(255,255,255,.12);color:#fff}

<body>
<div class="wrap">

<div class="card">
  <div class="card-hdr">
    <span class="dot"></span>
    <span class="lb">音乐解密</span>
    <span class="rt"><a href="/Music">← 音乐解锁</a></span>
  </div>
  <div class="card-pad">

    <div class="tide-section" id="tideSection">
      <div class="tide-row">
        <input type="text" class="tide-input" id="tideUrl" placeholder="粘贴潮汐分享链接，如 https://tide.fm/zh_CN/share/sleep-stories/...">
        <button class="btn tide-btn" id="tideBtn">解析</button>
      </div>
      <div class="tide-preview" id="tidePreview" style="display:none">
        <img class="tide-cover" id="tideCoverImg">
        <div class="tide-info">
          <div class="tide-title" id="tideTitle"></div>
          <div class="tide-actions">
            <button class="btn tide-dl-btn" id="tideDlAudio">下载音频</button>
            <button class="btn tide-dl-btn tide-dl-cover" id="tideDlCover">下载封面</button>
            <button class="btn tide-dl-btn tide-dl-embed" id="tideDlEmbed">下载(含封面)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="ic">📂</div>

      <div class="ht">或点击选择 · 可多选</div>
      <input type="file" id="fileInput" multiple
        accept=".kgm,.kgma,.kgm.flac,.kgma.flac,.ncm,.qmc0,.qmc2,.qmc3,.qmcflac,.qmcogg,.mflac,.mgg,.mflac0,.mgg1,.tkm,.bkcmp3,.bkcflac,.kwm,.xm,.tm0,.tm2,.tm3,.tm6" hidden>
    </div>

    <div class="fl" id="fl"></div>

    <button class="btn" id="goBtn" disabled>开始解密</button>

    <div class="pg" id="pg">
      <div class="pt" id="pt"></div>
      <div class="pb"><div class="pf" id="pf"></div></div>
    </div>

    <div class="ba" id="ba">
      <a class="dla" id="dlAll">下载zip</a>
      <a class="dla" id="dlBatch">批量下载</a>
    </div>

    <div class="er" id="er"></div>

  </div>
</div>

<div class="card">
  <div class="nt">
    <strong>支持的格式</strong><br>
    🟣 酷狗 KGM · 🟥 网易云 NCM · 🔵 QQ音乐 QMC / MFLAC / MGG<br>
    🟠 酷我 KWM · 🟩 虾米 XM · 🌊 潮汐 Tide.fm (URL)<br>
    • 文件在浏览器本地处理，<strong>不会上传</strong>到任何服务器<br>
    • 仅 KGM 需要从服务器获取密钥段（几十 KB）<br>
    • 解密后自动识别格式，可单独下载 / 打包 zip / 批量下载
  </div>
</div>

</div>

<script>
const WORKER_URL = "worker.js";
const KSS=16;
let workerPool=[];
let callbacks=new Map();
let nextMsgId=0;

// ── 每个任务新建一个 Worker（ee57f4b 方式，速度正常） ──
function getWorker(){
  const w=new Worker(WORKER_URL);
  const idx=workerPool.length;
  w._idx=idx;
  w.onmessage=function(ev){
    const msg=ev.data;
    if(msg.type==='ready'){console.log('[Worker]',idx,'就绪');return}
    const cb=callbacks.get(msg.id);
    if(cb){callbacks.delete(msg.id);if(msg.success) cb.resolve(msg);else cb.reject(new Error(msg.error||'解密失败'))}
    else console.warn('[Worker]',idx,'未知 msg id:',msg.id);
  };
  w.onerror=function(ev){
    console.error('[Worker]',idx,'错误:',ev.message);
    const cb=callbacks.get(w._currentId);
    if(cb){callbacks.delete(w._currentId);cb.reject(new Error('Worker '+idx+' 错误: '+ev.message))}
  };
  workerPool.push(w);
  return w;
}

function runInWorker(arrayBuffer,format,fileName,extra){
  return new Promise((resolve,reject)=>{
    const id=++nextMsgId;
    callbacks.set(id,{resolve,reject});
    const w=getWorker();
    w._currentId=id;
    const msg={id,arrayBuffer,format,fileName,origin:location.origin};
    const transfer=[arrayBuffer];
    if(extra&&extra.keyData){msg.keyData=extra.keyData;transfer.push(extra.keyData)}
    console.log('[Dispatch]',fileName,'→ Worker',w._idx,'id:',id);
    w.postMessage(msg,transfer);
  });
}

// ── KGM 密钥：API 一次获取全部所需密钥段 → 内存缓存 ──
let _kgmKey=null;

async function getKugouKey(fileBuffers){
  if(_kgmKey) return _kgmKey;
  let maxSn=0;
  for(let i=0;i<fileBuffers.length;i++){
    if(files[i].fmt==='kgm'){
      const al=fileBuffers[i].byteLength-1024;
      const sn=Math.ceil(al/KSS);
      if(sn>maxSn) maxSn=sn;
    }
  }
  if(maxSn===0) return null;
  pt.textContent='获取 KGM 密钥…('+maxSn+' bytes)';
  const resp=await fetch('/api/decrypt-key?slots=0&count='+maxSn);
  if(!resp.ok) throw new Error('密钥获取失败');
  _kgmKey=new Uint8Array(await resp.arrayBuffer());
  console.log('[KGM] 密钥已获取:',_kgmKey.length,'bytes');
  return _kgmKey;
}

function getKgmKeySlice(fileByteLength){
  if(!_kgmKey) return null;
  const al=fileByteLength-1024;
  const sn=Math.ceil(al/KSS);
  const len=Math.min(sn,_kgmKey.length);
  return _kgmKey.slice(0,len).buffer;
}

// ── DOM ──
const $=s=>document.querySelector(s);
const dz=$('#dropZone'),fi=$('#fileInput'),fl=$('#fl'),go=$('#goBtn');
const pg=$('#pg'),pt=$('#pt'),pf=$('#pf'),er=$('#er');
const ba=$('#ba'),dlAll=$('#dlAll'),dlBatch=$('#dlBatch');
let files=[];
let isDecrypting=false;

dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');addFiles(e.dataTransfer.files)};
fi.onchange=()=>{if(fi.files.length)addFiles(fi.files);fi.value=''};
go.onclick=decryptAll;

fl.onclick=e=>{
  const dl=e.target.closest('.dl');
  if(dl&&dl.classList.contains('ok')){const idx=parseInt(dl.dataset.idx);if(files[idx]&&files[idx].url) saveFile(files[idx].url,files[idx].dlName);return}
  const rm=e.target.closest('.rm');
  if(rm&&!isDecrypting){removeFile(parseInt(rm.dataset.rm))}
};

dlBatch.onclick=function(e){
  e.preventDefault();
  const done=files.filter(f=>f.status==='done');
  if(!done.length) return;
  dlBatch.textContent='批量下载中…';
  dlBatch.style.pointerEvents='none';
  let delay=0;
  for(const f of done){
    if(f.url){
      setTimeout(()=>{
        const a=document.createElement('a');
        a.href=f.url;a.download=f.dlName||'download';
        document.body.appendChild(a);a.click();
        setTimeout(()=>document.body.removeChild(a),2000);
      },delay);
      delay+=400;
    }
  }
  setTimeout(()=>{
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  },delay+1000);
};

function saveFile(url,name){
  const a=document.createElement('a');a.href=url;a.download=name||'download';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},120000)
}

function addFiles(list){
  if(isDecrypting) return;
  let added=0;
  for(const f of list){
    const fmt=detectFormat(f.name);
    if(!fmt) continue;
    files.push({file:f,name:f.name,size:f.size,status:'pending',blob:null,url:null,err:null,fmt});
    added++;
  }
  if(added<list.length) errMsg('已跳过 '+(list.length-added)+' 个不支持的格式');
  renderList();
  go.disabled=files.length===0;
  er.classList.remove('show');
  ba.classList.remove('show');
}

function renderList(){
  if(!files.length){fl.classList.remove('show');return}
  fl.classList.add('show');
  fl.innerHTML=files.map((f,i)=>{
    const stCls=f.status==='done'?'dn':f.status==='err'?'er':'pd';
    const stSym=f.status==='done'?'✓':f.status==='err'?'!':'';
    const dlCls=f.status==='done'?'ok':'';
    const fmtCls=getFormatColor(f.fmt);
    const fmtLb=getFormatLabel(f.fmt);
    const szTxt=f.status==='done'?sz(f.blob.size):f.status==='err'?f.err:f.status==='processing'?'处理中…':sz(f.size);
    return `<div class="fi" data-i="${i}">
      <span class="st ${stCls}">${stSym}</span>
      <span class="tag ${fmtCls}">${fmtLb}</span>
      <span class="nm">${f.name}</span>
      <span class="sz">${szTxt}</span>
      <a class="dl ${dlCls}" data-idx="${i}">下载</a>
      <span class="rm" data-rm="${i}">✕</span>
    </div>`;
  }).join('');
  const allDone=files.length>0&&files.every(f=>f.status==='done');
  ba.classList.toggle('show',allDone);
}

function detectFormat(name){
  const n=name.toLowerCase();
  if(/\.kgm(\.(flac|mp3))?$|\.kgma/i.test(n)) return 'kgm';
  if(/\.ncm$/i.test(n)) return 'ncm';
  if(/\.qmc0$/i.test(n)) return 'qmc';
  if(/\.qmc2$/i.test(n)) return 'qmc';
  if(/\.qmc3$/i.test(n)) return 'qmc';
  if(/\.qmcflac$/i.test(n)) return 'qmc';
  if(/\.qmcogg$/i.test(n)) return 'qmc';
  if(/\.mflac\d?$/i.test(n)) return 'qmc';
  if(/\.mgg\d?$/i.test(n)) return 'qmc';
  if(/\.tkm$/i.test(n)) return 'qmc';
  if(/\.bkcmp3$|\.bkcflac$/i.test(n)) return 'qmc';
  if(/\.666c6163$|\.6d7033$|\.6f6767$|\.6d3461$|\.776176$/i.test(n)) return 'qmc';
  if(/\.kwm$/i.test(n)) return 'kwm';
  if(/\.xm$/i.test(n)) return 'xm';
  if(/\.tm[0236]$/i.test(n)) return 'raw';
  return null;
}

function getFormatColor(fmt){
  return {kgm:'kgm',ncm:'ncm',qmc:'qmc',kwm:'kwm',xm:'xm',raw:'raw'}[fmt]||'';
}
function getFormatLabel(fmt){
  return {kgm:'KGM',ncm:'NCM',qmc:'QMC',kwm:'KWM',xm:'XM',raw:'RAW'}[fmt]||fmt;
}
function sz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}

window.removeFile=function(i){
  if(isDecrypting) return;
  if(files[i]&&files[i].url) URL.revokeObjectURL(files[i].url);
  files.splice(i,1);
  renderList();
  go.disabled=files.length===0;
};

// ── 并行解密 ──
async function decryptAll(){
  if(!files.length||isDecrypting) return;
  isDecrypting=true;
  er.classList.remove('show');ba.classList.remove('show');
  go.disabled=true;pg.classList.add('show');

  for(let i=0;i<files.length;i++) if(files[i].status!=='done'){files[i].status='pending';files[i].blob=null;files[i].url=null;files[i].err=null}
  renderList();

  const total=files.length;
  let doneCount=0,errCount=0;

  // Phase 1: 并行读取所有文件
  pt.textContent='读取文件中…';
  pf.style.width='10%';
  let fileBuffers;
  try{
    fileBuffers=await Promise.all(files.map(f=>f.file.arrayBuffer()));
  }catch(e){
    errMsg('读取文件失败: '+e.message);
    isDecrypting=false;go.disabled=false;pg.classList.remove('show');
    return;
  }

  // Phase 2: 标记所有文件为「处理中」
  for(let i=0;i<total;i++) files[i].status='processing';
  renderList();
  pf.style.width='20%';
  pt.textContent='解密中 0/'+total;

  // Phase 2.5: 如有 KGM 文件，一次 API 获取全部密钥
  const hasKgm=files.some(f=>f.fmt==='kgm');
  if(hasKgm){
    try{
      await getKugouKey(fileBuffers);
    }catch(e){
      console.warn('[KGM] 密钥获取失败，各 Worker 将独立请求:', e.message);
    }
    pf.style.width='20%';
    pt.textContent='解密中 0/'+total;
  }

  // Phase 3: 每文件新建 Worker 并发解密
  let completed=0;
  const workerPromises=fileBuffers.map((buf,i)=>{
    const extra={};
    if(files[i].fmt==='kgm'){
      const slice=getKgmKeySlice(buf.byteLength);
      if(slice) extra.keyData=slice;
    }
    files[i]._t0=Date.now();
    return runInWorker(buf,files[i].fmt,files[i].name,extra)
      .then(msg=>{
        const f=files[i];
        const decBytes=new Uint8Array(msg.result);
        f.blob=new Blob([decBytes],{type:msg.audioMime||'application/octet-stream'});
        f.url=URL.createObjectURL(f.blob);
        f.dlName=msg.dlName||f.name;
        f.status='done';
        doneCount++;
      })
      .catch(err=>{
        files[i].status='err';
        files[i].err=err.message||'解密异常';
        errCount++;
      })
      .finally(()=>{
        completed++;
        renderList();
        pf.style.width=(20+(completed/total*80))+'%';
        pt.textContent='已完成 '+doneCount+'/'+total+' 文件'+(errCount>0?', 失败 '+errCount:'')+(completed<total?', 解密中 '+(total-completed)+' 个':'');
      })
  });

  await Promise.all(workerPromises);

  isDecrypting=false;
  go.disabled=false;pg.classList.remove('show');

  const done=files.filter(f=>f.status==='done');
  if(done.length>0){
    ba.classList.add('show');
    if(done.length===1){
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.onclick=e=>{e.preventDefault();saveFile(done[0].url,done[0].dlName)};
    }else{
      dlAll.textContent='下载zip';
      dlAll.href='#';dlAll.download='';
      dlAll.onclick=async(e)=>{
        e.preventDefault();
        dlAll.textContent='打包中…';
        const JSZip=await new Promise(r=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          s.onload=()=>r(window.JSZip);document.head.appendChild(s);
        });
        const zip=new JSZip();
        for(const f of done) zip.file(f.dlName,f.blob);
        const blob=await zip.generateAsync({type:'blob'});
        const u=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=u;a.download='decrypted.zip';a.click();
        setTimeout(()=>URL.revokeObjectURL(u),60000);
        dlAll.textContent='下载zip';
      };
    }
    dlBatch.textContent='批量下载';
    dlBatch.style.pointerEvents='';
  }
  if(errCount>0) errMsg(errCount+' 个文件解密失败，请查看列表中的错误信息');
}

function errMsg(m){er.textContent='❌ '+m;er.classList.add('show')}

// ════════════════════════════════════════════════════════
// Tide.fm 支持
// ════════════════════════════════════════════════════════
const tideUrl=$('#tideUrl'),tideBtn=$('#tideBtn'),tidePreview=$('#tidePreview');
const tideCoverImg=$('#tideCoverImg'),tideTitle=$('#tideTitle');
const tideDlAudio=$('#tideDlAudio'),tideDlCover=$('#tideDlCover'),tideDlEmbed=$('#tideDlEmbed');
let tideData=null; // {title, cover, audio}

// Parse tide URL
tideBtn.onclick=async function(){
  const url=tideUrl.value.trim();
  if(!url||!url.includes('tide.fm')){showTideError('请输入有效的潮汐链接');return}
  tideBtn.disabled=true;tideBtn.textContent='解析中…';
  hideTideError();
  try{
    const resp=await fetch('/api/tide-parse',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})
    });
    const data=await resp.json();
    if(!resp.ok||data.error) throw new Error(data.error||'解析失败');
    tideData=data;
    tideTitle.textContent=data.title||'未知标题';
    tideCoverImg.src=data.cover||'';
    tideCoverImg.style.display=data.cover?'block':'none';
    tidePreview.style.display='flex';
    console.log('[Tide] 解析完成:',data);
  }catch(e){
    showTideError(e.message);
  }finally{
    tideBtn.disabled=false;tideBtn.textContent='解析';
  }
};

// Enter key to parse
tideUrl.onkeydown=e=>{if(e.key==='Enter')tideBtn.click()};

// Download audio (raw, no cover embed)
tideDlAudio.onclick=async function(){
  if(!tideData||!tideData.audio) return;
  tideDlAudio.textContent='下载中…';tideDlAudio.disabled=true;
  try{
    const blob=await fetchAudioBlob(tideData.audio);
    const name=(tideData.title||'tide_audio')+'.mp3';
    saveFile(URL.createObjectURL(blob),name);
  }catch(e){showTideError('音频下载失败: '+e.message)}
  finally{tideDlAudio.textContent='下载音频';tideDlAudio.disabled=false}
};

// Download cover image
tideDlCover.onclick=async function(){
  if(!tideData||!tideData.cover) return;
  tideDlCover.textContent='下载中…';tideDlCover.disabled=true;
  try{
    const resp=await fetch(tideData.cover);
    if(!resp.ok) throw new Error('封面获取失败');
    const blob=await resp.blob();
    const ext=blob.type.includes('png')?'png':'jpg';
    const name=(tideData.title||'tide_cover')+'.'+ext;
    saveFile(URL.createObjectURL(blob),name);
  }catch(e){showTideError('封面下载失败: '+e.message)}
  finally{tideDlCover.textContent='下载封面';tideDlCover.disabled=false}
};

// Download audio with embedded cover
tideDlEmbed.onclick=async function(){
  if(!tideData||!tideData.audio) return;
  tideDlEmbed.textContent='处理中…';tideDlEmbed.disabled=true;
  try{
    // Fetch audio and cover in parallel
    const [audioBuf,coverResp]=await Promise.all([
      fetchAudioArrayBuffer(tideData.audio),
      tideData.cover ? fetch(tideData.cover) : Promise.resolve(null)
    ]);
    let coverData=null;
    if(coverResp&&coverResp.ok){
      const coverBlob=await coverResp.blob();
      coverData=await blobToBase64(coverBlob);
    }
    // Embed cover into audio ID3 tags
    const result=await embedCover(audioBuf,coverData,tideData.title);
    const name=(tideData.title||'tide_audio')+'.mp3';
    saveFile(URL.createObjectURL(new Blob([result],{type:'audio/mpeg'})),name);
  }catch(e){showTideError('处理失败: '+e.message);console.error('[Tide]',e)}
  finally{tideDlEmbed.textContent='下载(含封面)';tideDlEmbed.disabled=false}
};

// ── Helper functions ──
async function fetchAudioBlob(audioUrl){
  // Try direct fetch first (works if CORS allows)
  try{
    const resp=await fetch(audioUrl);
    if(resp.ok) return await resp.blob();
  }catch(e){}
  // Fallback: use a proxy/relay approach via the API
  // For tide.fm audio URLs, they typically allow cross-origin
  throw new Error('音频下载失败，可能受跨域限制');
}

async function fetchAudioArrayBuffer(audioUrl){
  const blob=await fetchAudioBlob(audioUrl);
  return await blob.arrayBuffer();
}

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result); // data:image/xxx;base64,...
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function embedCover(audioArrayBuffer,coverDataUrl,title){
  // Build ID3v2.3 tags manually and prepend to audio
  const enc=new TextEncoder();
  const frames=[];

  // TIT2 (title)
  if(title){
    frames.push(buildTextFrame('TIT2',title));
  }

  // TPE1 (artist)
  frames.push(buildTextFrame('TPE1','Tide'));

  // APIC (cover image)
  if(coverDataUrl){
    const imgData=parseBase64DataUrl(coverDataUrl);
    if(imgData){
      frames.push(buildApicFrame(imgData));
    }
  }

  if(!frames.length) return audioArrayBuffer;

  // Assemble ID3v2.3 header + frames
  const frameData=concatUint8Arrays(frames);
  const id3Header=buildId3v2Header(frameData.length);

  // Combine: ID3v2 header + frames + original audio
  const result=new Uint8Array(id3Header.length+frameData.length+audioArrayBuffer.byteLength);
  result.set(id3Header,0);
  result.set(frameData,id3Header.length);
  result.set(new Uint8Array(audioArrayBuffer),id3Header.length+frameData.length);
  return result.buffer;
}

function parseBase64DataUrl(dataUrl){
  const match=dataUrl.match(/^data:([^;]+);base64,(.+)$/);
  if(!match) return null;
  const mime=match[1];
  const b64=match[2];
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return {mime,data:bytes};
}

function buildId3v2Header(size){
  // ID3v2.3 header: 10 bytes
  const header=new Uint8Array(10);
  header[0]=0x49; // I
  header[1]=0x44; // D
  header[2]=0x33; // 3
  header[3]=0x03; // version 2.3
  header[4]=0x00; // revision
  header[5]=0x00; // flags (none)
  // Size as synchsafe integer (7 bits per byte)
  header[6]=(size>>21)&0x7F;
  header[7]=(size>>14)&0x7F;
  header[8]=(size>>7)&0x7F;
  header[9]=size&0x7F;
  return header;
}

function buildTextFrame(frameId,text){
  const enc=new TextEncoder();
  const textBytes=enc.encode(text);
  // Frame: ID(4) + size(4) + flags(2) + encoding(1) + text
  const frameSize=textBytes.length+1;
  const frame=new Uint8Array(10+frameSize);
  // Frame ID
  frame[0]=frameId.charCodeAt(0);
  frame[1]=frameId.charCodeAt(1);
  frame[2]=frameId.charCodeAt(2);
  frame[3]=frameId.charCodeAt(3);
  // Size (big-endian, non-synchsafe for frame size in v2.3)
  frame[4]=(frameSize>>24)&0xFF;
  frame[5]=(frameSize>>16)&0xFF;
  frame[6]=(frameSize>>8)&0xFF;
  frame[7]=frameSize&0xFF;
  // Flags
  frame[8]=0;frame[9]=0;
  // Encoding: UTF-8
  frame[10]=0x03;
  // Text
  frame.set(textBytes,11);
  return frame;
}

function buildApicFrame(imgInfo){
  const enc=new TextEncoder();
  const mime=enc.encode(imgInfo.mime);
  const desc=enc.encode(''); // empty description
  // Frame content: encoding(1) + mime(null-terminated) + picture type(1) + description(null-terminated) + data
  const contentLen=1+mime.length+1+1+desc.length+1+imgInfo.data.length;
  const frame=new Uint8Array(10+contentLen);
  // Frame ID: APIC
  frame[0]=0x41;frame[1]=0x50;frame[2]=0x49;frame[3]=0x43;
  // Size
  frame[4]=(contentLen>>24)&0xFF;
  frame[5]=(contentLen>>16)&0xFF;
  frame[6]=(contentLen>>8)&0xFF;
  frame[7]=contentLen&0xFF;
  // Flags
  frame[8]=0;frame[9]=0;
  // Encoding
  frame[10]=0x03; // UTF-8
  // MIME type (null-terminated)
  let off=11;
  frame.set(mime,off);off+=mime.length;frame[off++]=0;
  // Picture type: 0x03 = front cover
  frame[off++]=0x03;
  // Description (null-terminated)
  frame.set(desc,off);off+=desc.length;frame[off++]=0;
  // Image data
  frame.set(imgInfo.data,off);
  return frame;
}

function concatUint8Arrays(arrays){
  let totalLen=0;
  for(const a of arrays) totalLen+=a.length;
  const result=new Uint8Array(totalLen);
  let off=0;
  for(const a of arrays){result.set(a,off);off+=a.length}
  return result;
}

function showTideError(msg){
  let el=document.getElementById('tideError');
  if(!el){el=document.createElement('div');el.id='tideError';el.className='tide-error';
    tidePreview.parentNode.insertBefore(el,tidePreview.nextSibling)}
  el.textContent='❌ '+msg;el.style.display='block';
}
function hideTideError(){
  const el=document.getElementById('tideError');
  if(el) el.style.display='none';
}
