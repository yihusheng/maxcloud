<!DOCTYPE html><html lang=zh-cn>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Unicode 符号 &amp; Emoji 浏览器</title>
<link rel=preconnect href="https://fonts.googleapis.com">
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Noto+Sans+SC:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel=stylesheet>
<style>
:root{--f:'Inter','Noto Sans SC',sans-serif;--k:#1a1d19;--kd:#1e221e;--c:#f0f2ee;--p:#9fe870;--pp:#b8f08c;--s:#e1e4df;--m:#848a80;--b:#464b42;--neg:#d65a5a;--cm:64px;--cg:5px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--k);color:var(--k);min-height:100dvh;display:flex;flex-direction:column}
.card{max-width:900px;margin:0 auto;width:100%;padding:20px 16px 8px}
.sub{font-size:13px;color:var(--m);font-weight:500}
.tabs{display:flex;border-radius:16px;overflow:hidden;border:3px solid var(--s);margin-bottom:12px}
.tab{flex:1;padding:11px 16px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;background:var(--s);color:var(--b)}
.tab.act{background:var(--k);color:var(--p)}.tab:hover{background:var(--pp)}
.stabs{display:flex;gap:6px;margin-bottom:10px}
.stab{flex:1;padding:8px 12px;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.12s;background:var(--c);color:var(--b);border:2px solid var(--s)}
.stab.act{background:var(--k);color:var(--p);border-color:var(--k)}.stab:hover{border-color:var(--pp)}
.cpills{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.cpill{padding:5px 12px;border:2px solid var(--s);border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;transition:.12s;background:transparent;color:var(--b);font-family:inherit;white-space:nowrap}
.cpill:hover{border-color:var(--pp);color:var(--kd)}
.cpill.act{background:var(--k);color:var(--p);border-color:var(--k)}
.sb{display:flex;gap:8px;margin-bottom:10px}
.sb input{flex:1;height:40px;background:var(--c);border:2px solid var(--k);border-radius:12px;padding:0 12px;font-family:var(--f);font-size:13px;color:var(--k);outline:none}
.sb input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(159,232,112,.2)}
.sb .cnt{font-size:12px;font-weight:600;color:var(--m);display:flex;align-items:center;white-space:nowrap;padding:0 6px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cm),1fr));gap:var(--cg)}
.sc{background:var(--c);border-radius:14px;padding:7px 3px;text-align:center;cursor:pointer;transition:.1s;border:2px solid transparent;user-select:none}
.sc:hover{border-color:var(--p);background:var(--pp);transform:translateY(-1px)}
.sc:active{transform:scale(.94)}
.sc .ch{font-size:26px;line-height:1.2;min-height:1.2em;display:flex;align-items:center;justify-content:center;margin-bottom:1px;font-family:'Noto Sans Symbols','Segoe UI Symbol','Apple Symbols','Noto Sans Egyptian Hieroglyphs',sans-serif}
.sc .cp{font-size:8.5px;font-weight:700;color:var(--m);letter-spacing:-.15px;line-height:1.2}
.sc .nm{font-size:7.5px;color:var(--b);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:2.3em;margin-top:1px;word-break:break-all}
.sentinel{text-align:center;padding:20px;font-size:12px;color:var(--m);font-weight:600;letter-spacing:.5px}
.sentinel.s-hide{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sentinel::before{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--s);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
.sentinel.s-done::before{display:none}
.bdesc{font-size:11px;color:var(--m);margin-bottom:8px;font-weight:500}
.badge{background:var(--c);color:var(--b);border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700;vertical-align:middle;margin-left:3px}
.nohit{text-align:center;padding:40px 20px;color:var(--m);font-size:13px;font-weight:500}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--p);padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.s{opacity:1}
#emojiGrid,#unicodeGrid{min-height:120px}
.hist{margin-top:16px;border-top:2px solid var(--s);padding-top:12px}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hist-hdr .lb{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--m);letter-spacing:.3px;display:flex;align-items:center;gap:4px}
.hist-hdr .lb .ms{font-size:13px}
.hist-hdr .clr{font-size:10px;color:var(--b);cursor:pointer;padding:2px 10px;border-radius:999px;border:1px solid var(--s);background:transparent;font-family:inherit;font-weight:600;transition:.12s}
.hist-hdr .clr:hover{background:var(--s);color:var(--neg)}
.hist-grid{display:flex;gap:5px;flex-wrap:wrap}
.hist-item{display:flex;align-items:center;gap:5px;background:var(--s);border-radius:10px;padding:3px 8px 3px 5px;cursor:pointer;transition:.1s}
.hist-item:hover{background:var(--pp)}
</style>

<div class=card>
  <h1 style="font-size:26px;margin-bottom:2px">Unicode 符号 &amp; Emoji</h1>
  <p class=sub style="margin-bottom:12px">浏览符号与 Emoji，点击复制，历史记录自动保存</p>

  <div class=tabs id=mainTabs>
    <button class="tab act" data-tab=unicode><span class="material-symbols-rounded" style="font-size:15px;vertical-align:middle">abc</span> Unicode 符号 <span class=badge id=unicodeBadge>—</span></button>
    <button class=tab data-tab=emoji><span class="material-symbols-rounded" style="font-size:15px;vertical-align:middle">mood</span> Emoji <span class=badge id=emojiBadge>—</span></button>
  </div>

  <div id=panelUnicode>
    <div class=stabs id=unicodeSubTabs>
      <button class="stab act" data-sub=public>公共区</button>
      <button class=stab data-sub=private>私人区 (PUA)</button>
    </div>
    <div id=unicodePublicCtr style=display:block>
      <div class=cpills id=unicodeBlockPills></div>
      <div class=bdesc id=unicodeBlockDesc></div>
    </div>
    <div id=unicodePrivateCtr style=display:none>
      <div class=cpills id=unicodePuaPills>
        <button class="cpill act" data-range=bmp>BMP PUA <small>U+E000–U+F8FF</small></button>
        <button class=cpill data-range=supa>Supp PUA-A <small>U+F0000–U+FFFFD</small></button>
        <button class=cpill data-range=supb>Supp PUA-B <small>U+100000–U+10FFFD</small></button>
      </div>
      <div class=bdesc id=unicodePuaDesc></div>
    </div>
    <div class=sb>
      <input type=text id=unicodeSearch placeholder="搜索码点 (如 13000, 2200) 或范围 (如 13000-1342F)…" spellcheck=false>
      <span class=cnt id=unicodeResultCnt></span>
    </div>
    <div id=unicodeGrid></div>
    <div id=unicodeSentinel class=sentinel></div>
  </div>

  <div id=panelEmoji style=display:none>
    <div class=stabs id=emojiSubTabs>
      <button class="stab act" data-sub=public>公共区</button>
      <button class=stab data-sub=private>私人区 (PUA)</button>
    </div>
    <div id=emojiPublicCtr style=display:block>
      <div class=cpills id=emojiCatPills></div>
    </div>
    <div id=emojiPrivateCtr style=display:none>
      <div class=cpills id=emojiPuaPills>
        <button class="cpill act" data-range=zwj>ZWJ <small>U+200D</small></button>
        <button class=cpill data-range=vs>异体选择符 <small>U+FE00–U+FE0F</small></button>
        <button class=cpill data-range=tags>标签 Tags <small>U+E0020–U+E007F</small></button>
      </div>
      <div class=bdesc style="color:var(--m);font-size:11px;margin-bottom:8px">Emoji 辅助字符：零宽连字、异体选择符、标签序列</div>
    </div>
    <div class=sb>
      <input type=text id=emojiSearch placeholder="搜索 emoji（名称 / 码点 / 直接输入 emoji 字符）…" spellcheck=false>
      <span class=cnt id=emojiResultCnt></span>
    </div>
    <div id=emojiGrid></div>
    <div id=emojiSentinel class=sentinel></div>
  </div>

  <div class=hist id=history>
    <div class=hist-hdr>
      <span class=lb><span class="material-symbols-rounded ms">history</span> 复制历史</span>
      <button class=clr id=clearHistory>清空</button>
    </div>
    <div class=hist-grid id=histGrid></div>
  </div>
</div>

<div class=toast id=toast></div>

<div class=card-dark style="padding:12px 24px;text-align:center;margin-top:auto">
  <p style="font-size:10px;color:rgba(232,235,230,.5)">Unicode Symbol &amp; Emoji Browser · <span id=footerCount>0</span> 个字符</p>
</div>

<script src="emoji-data.js"></script>
<script>
(function(){
"use strict";

var PER_BATCH=200;
var state={
  tab:'unicode',unicodeSub:'public',privateRange:'bmp',publicBlock:'arrows',
  unicodeSearch:'',
  emojiSub:'public',emojiCat:'all',emojiPuaRange:'zwj',
  emojiSearch:'',history:[]
};

// ── Cookie helpers ──
function getCookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n.replace(/([.$?*|{}()[\\]\\\\/+^])/g,'\\\\$1')+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}
function setCookie(n,v,d){var e=new Date();e.setDate(e.getDate()+d);document.cookie=n+'='+encodeURIComponent(v)+'; expires='+e.toUTCString()+'; path=/'}
function getPuaName(cp){return cp<=0xF8FF?'Private Use, BMP PUA':cp<=0xFFFFD?'Private Use, Supp PUA-A':'Private Use, Supp PUA-B'}
function getEmojiPuaName(cp){
  if(cp===0x200D)return 'Zero Width Joiner, Emoji ZWJ';
  if(cp>=0xFE00&&cp<=0xFE0F)return 'Variation Selector-'+(cp-0xFE00+1)+', Emoji Presentation';
  if(cp>=0xE0020&&cp<=0xE007F)return 'Tag '+(cp-0xE0020).toString()+', Emoji Tag Sequence';
  return 'U+'+cp.toString(16).toUpperCase();
}
function loadHistory(){try{var r=getCookie('unicode_history');if(r){state.history=JSON.parse(r);if(!Array.isArray(state.history))state.history=[]}}catch(e){state.history=[]}}
function saveHistory(){if(state.history.length>50)state.history=state.history.slice(0,50);setCookie('unicode_history',JSON.stringify(state.history),365)}
function addHistory(item){for(var i=0;i<state.history.length;i++){if(state.history[i].cp===item.cp){state.history.splice(i,1);break}}state.history.unshift(item);saveHistory();renderHistory()}
function clearHistory(){state.history=[];setCookie('unicode_history','',-1);renderHistory()}

// ── Paged items helper ── (kept for range-based blocks that compute on the fly)
function getPagedItems(total,allItems,rangeStart,rangeEnd,page,perPage){
  if(page===undefined)page=0;if(perPage===undefined)perPage=PER_BATCH;
  if(allItems){
    var pages=Math.ceil(allItems.length/perPage)||1;
    if(page>=pages)page=pages-1;
    var start=page*perPage,end=Math.min(start+perPage-1,allItems.length-1);
    return{items:allItems.slice(start,end+1),total:allItems.length,pages:pages,page:page};
  }
  var pages=Math.ceil(total/perPage);
  if(page>=pages)page=pages-1;
  var s=rangeStart+page*perPage,e=Math.min(s+perPage-1,rangeEnd),items=[];
  for(var i=s;i<=e;i++)items.push({cp:i,ch:String.fromCodePoint(i)});
  return{items:items,total:total,pages:pages,page:page};
}

// ── Infinite scroll ──
var _infState={u:{items:null,loaded:0},e:{items:null,loaded:0}};
var _infObs=null;

function _renderBatch(grid,items,start,count){
  var end=Math.min(start+count,items.length);
  if(start>=end)return 0;
  var html='<div class="sg">';
  for(var i=start;i<end;i++){
    var it=items[i],hex=it.cp.toString(16).toUpperCase();
    while(hex.length<4)hex='0'+hex;
    var name=it.name||'';
    html+='<div class="sc" data-cp="'+it.cp+'"><div class="ch">'+it.ch+'</div><div class="cp">U+'+hex+'</div><div class="nm">'+name+'</div></div>';
  }
  html+='</div>';
  grid.insertAdjacentHTML('beforeend',html);
  // Click handlers for new cells
  var wrapper=grid.lastElementChild;
  var cells=wrapper.querySelectorAll('.sc');
  for(var i=0;i<cells.length;i++)cells[i].addEventListener('click',function(e){
    var el=e.currentTarget,cp=parseInt(el.getAttribute('data-cp')),ch=el.querySelector('.ch').textContent;
    var hex=cp.toString(16).toUpperCase();while(hex.length<4)hex='0'+hex;
    var nm=el.querySelector('.nm').textContent;
    copyChar(ch,cp,hex,nm);
  });
  return end-start;
}

function _stopInfScroll(){
  if(_infObs){_infObs.disconnect();_infObs=null}
}

function _startInfScroll(gridId,items){
  var grid=document.getElementById(gridId);
  _stopInfScroll();
  grid.innerHTML='';
  var isE=gridId==='emojiGrid';
  var st=isE?_infState.e:_infState.u;
  st.items=items||[];
  st.loaded=0;
  var sentinel=document.getElementById(gridId+'Sentinel');
  if(!sentinel)return;
  sentinel.className='sentinel';
  // Render first batch
  var added=_renderBatch(grid,st.items,0,PER_BATCH);
  st.loaded=added;
  if(st.loaded>=st.items.length){sentinel.className='sentinel s-done';return}
  _infObs=new IntersectionObserver(function(entries){
    if(!entries[0].isIntersecting)return;
    var cur=isE?_infState.e:_infState.u;
    if(!cur||cur.loaded>=cur.items.length){sentinel.className='sentinel s-done';return}
    var cnt=_renderBatch(grid,cur.items,cur.loaded,PER_BATCH);
    cur.loaded+=cnt;
    if(cur.loaded>=cur.items.length)sentinel.className='sentinel s-done';
  },{rootMargin:'600px'});
  _infObs.observe(sentinel);
}

// ── Unicode blocks ──
var PUBLIC_BLOCKS=[
  {id:'arrows',  start:0x2190, end:0x21FF, desc:'箭头'},{id:'math',start:0x2200,end:0x22FF,desc:'数学运算符'},
  {id:'box',   start:0x2500,end:0x257F,desc:'制表符'},{id:'block',start:0x2580,end:0x259F,desc:'方块元素'},
  {id:'geometric',start:0x25A0,end:0x25FF,desc:'几何图形'},{id:'dingbats',start:0x2700,end:0x27BF,desc:'装饰符号'},
  {id:'cjk',   start:0x4E00,end:0x9FFF,desc:'中日韩统一表意文字'},{id:'ipa',start:0x0250,end:0x02AF,desc:'国际音标扩展'},
  {id:'greek', start:0x0370,end:0x03FF,desc:'希腊字母'},{id:'cyrillic',start:0x0400,end:0x04FF,desc:'西里尔字母'},
  {id:'hangul',start:0xAC00,end:0xD7AF,desc:'谚文音节'},{id:'kana',start:0x3040,end:0x309F,desc:'平假名'},
  {id:'katakana',start:0x30A0,end:0x30FF,desc:'片假名'},{id:'bopomofo',start:0x3100,end:0x312F,desc:'注音符号'},
  {id:'egypt', start:0x13000,end:0x1342F,desc:'古埃及象形文字'},{id:'cuneiform',start:0x12000,end:0x123FF,desc:'楔形文字'},
  {id:'runic', start:0x16A0,end:0x16FF,desc:'卢恩字母'},{id:'gothic',start:0x10330,end:0x1034F,desc:'哥特字母'},
  {id:'shavian',start:0x10450,end:0x1047F,desc:'萧伯纳字母'},{id:'tifinagh',start:0x2D30,end:0x2D7F,desc:'提非纳字母'},
  {id:'ogham', start:0x1680,end:0x169F,desc:'欧甘字母'},{id:'linear',start:0x10600,end:0x1077F,desc:'线形文字'},
  {id:'phoen', start:0x10900,end:0x1091F,desc:'腓尼基字母'},{id:'ugarit',start:0x10380,end:0x1039F,desc:'乌加里特字母'},
  {id:'deseret',start:0x10400,end:0x1044F,desc:'德瑟雷特字母'}
];

var PRIVATE_RANGES=[
  {id:'bmp',  start:0xE000,  end:0xF8FF,  desc:'BMP 私人使用区 (U+E000–U+F8FF)'},
  {id:'supa', start:0xF0000, end:0xFFFFD, desc:'Supplementary PUA-A (U+F0000–U+FFFFD)'},
  {id:'supb', start:0x100000,end:0x10FFFD,desc:'Supplementary PUA-B (U+100000–U+10FFFD)'}
];

function getPublicBlockItems(blockId,search){
  var blk=PUBLIC_BLOCKS.find(function(b){return b.id===blockId});
  if(!blk)return{total:0};
  var searchL=(search||'').toLowerCase().trim();
  if(searchL){
    var allItems=[];
    var rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
    if(rM){var s=parseInt(rM[1],16),e=parseInt(rM[2],16);for(var j=Math.max(blk.start,s);j<=Math.min(blk.end,e);j++)allItems.push({cp:j,ch:String.fromCodePoint(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=blk.start&&sc<=blk.end)allItems.push({cp:sc,ch:String.fromCodePoint(sc)})}
    return{allItems:allItems,total:allItems.length,block:blk};
  }
  return{total:blk.end-blk.start+1,block:blk};
}

function getPuaItems(rangeId,search){
  var r=PRIVATE_RANGES.find(function(rr){return rr.id===rangeId});
  if(!r)return{total:0};
  var searchL=(search||'').toLowerCase().trim();
  if(searchL){
    var allItems=[];
    var rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
    if(rM){var s=parseInt(rM[1],16),e=parseInt(rM[2],16);for(var j=Math.max(r.start,s);j<=Math.min(r.end,e);j++)allItems.push({cp:j,ch:String.fromCodePoint(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=r.start&&sc<=r.end)allItems.push({cp:sc,ch:String.fromCodePoint(sc)})}
    for(var i=0;i<allItems.length;i++){if(!allItems[i].name)allItems[i].name=getPuaName(allItems[i].cp)}
    return{allItems:allItems,total:allItems.length,range:r};
  }
  return{total:r.end-r.start+1,range:r};
}

// ── Unicode render ──
function renderUnicode(){
  var grid=document.getElementById('unicodeGrid');
  var search=state.unicodeSearch,sub=state.unicodeSub,countEl=document.getElementById('unicodeResultCnt');
  if(sub==='public'){
    var blockData=getPublicBlockItems(state.publicBlock,search);
    document.getElementById('unicodeBlockDesc').textContent=(blockData.block?blockData.block.desc:'')+' · '+blockData.total.toLocaleString()+' 个字符';
    if(blockData.allItems){
      state.totalCount=blockData.allItems.length;
      _startInfScroll('unicodeGrid',blockData.allItems);
    }else{
      state.totalCount=blockData.total;
      // Generate all items for block
      var allItems=[];
      for(var i=blockData.block.start;i<=blockData.block.end;i++)allItems.push({cp:i,ch:String.fromCodePoint(i)});
      _startInfScroll('unicodeGrid',allItems);
    }
    countEl.textContent=state.totalCount.toLocaleString()+' 个';
  }else{
    var puaData=getPuaItems(state.privateRange,search);
    document.getElementById('unicodePuaDesc').textContent=puaData.range?puaData.range.desc:'';
    if(puaData.allItems){
      state.totalCount=puaData.allItems.length;
      _startInfScroll('unicodeGrid',puaData.allItems);
    }else{
      state.totalCount=puaData.total;
      var allItems=[];
      for(var i=puaData.range.start;i<=puaData.range.end;i++)allItems.push({cp:i,ch:String.fromCodePoint(i),name:getPuaName(i)});
      _startInfScroll('unicodeGrid',allItems);
    }
    countEl.textContent=state.totalCount.toLocaleString()+' 个';
  }
  document.getElementById('footerCount').textContent=state.totalCount.toLocaleString();
  updateBadges();
}

// ── Emoji ──
// Reference data from emoji-data.js globals

function isEmojiChar(cp){
  if(cp>=0x1F600&&cp<=0x1F64F)return true;if(cp>=0x1F300&&cp<=0x1F5FF)return true;
  if(cp>=0x1F680&&cp<=0x1F6FF)return true;if(cp>=0x1F1E0&&cp<=0x1F1FF)return true;
  if(cp>=0x2600&&cp<=0x27BF)return true;if(cp>=0x2300&&cp<=0x23FF)return true;
  if(cp>=0xFE00&&cp<=0xFE0F)return true;if(cp>=0x200D)return true;
  if(cp>=0x1F900&&cp<=0x1F9FF)return true;if(cp>=0x1FA00&&cp<=0x1FAFF)return true;
  if(cp>=0x2702&&cp<=0x27B0)return true;
  return false;
}

function genAllEmoji(){
  var all=[];
  // Ranges
  for(var ci=0;ci<EMOJI_CATS.length;ci++){
    var cat=EMOJI_CATS[ci];
    if(cat.flagsOnly){
      var indivFlags=[{cp:0x1F3C1,name:'终点旗'},{cp:0x1F3F3,name:'白旗'},{cp:0x1F3F4,name:'黑旗'},{cp:0x1F6A9,name:'三角旗'},{cp:0x1F38C,name:'旗帜交差'}];
      for(var fi=0;fi<indivFlags.length;fi++){var f=indivFlags[fi];all.push({cp:f.cp,ch:String.fromCodePoint(f.cp),name:f.name,cat:'flags'})}
      for(var ci2=0;ci2<FLAG_COUNTRIES.length;ci2++){
        var fc=FLAG_COUNTRIES[ci2],code=fc[0],cname=fc[1];
        var ri1=0x1F1E6+code.charCodeAt(0)-65,ri2=0x1F1E6+code.charCodeAt(1)-65;
        var chName=(typeof FLAG_NAMES!=='undefined'&&FLAG_NAMES[code])?FLAG_NAMES[code]:cname;
        all.push({cp:ri1,ch:String.fromCodePoint(ri1)+String.fromCodePoint(ri2),name:'🏁 '+chName,code:code,cat:'flags',isPair:true});
      }
      continue;
    }
    var items=[];
    if(cat.ranges) for(var ri=0;ri<cat.ranges.length;ri++){
      var r=cat.ranges[ri];
      for(var i=r[0];i<=r[1];i++)items.push({cp:i,ch:String.fromCodePoint(i)});
    }else{
      for(var i=cat.start;i<=cat.end;i++)items.push({cp:i,ch:String.fromCodePoint(i)});
    }
    all=all.concat(items.map(function(it){
      var hex=it.cp.toString(16).toUpperCase();
      var name=EMOJI_NAMES[hex]||'';
      if(cat.flagsOnly)name='flag: '+name;
      return{cp:it.cp,ch:it.ch,name:name,cat:cat.id};
    }));
  }
  // EMOJI_NAMES extras go to misc
  for(var hex in EMOJI_NAMES){
    var cp=parseInt(hex,16);
    var found=false;
    for(var ci=0;ci<all.length;ci++){if(all[ci].cp===cp){found=true;break}}
    if(!found&&isEmojiChar(cp))all.push({cp:cp,ch:String.fromCodePoint(cp),name:EMOJI_NAMES[hex],cat:'misc'});
  }
  // EMOJI_SEQUENCES
  if(typeof EMOJI_SEQUENCES!=='undefined')for(var si=0;si<EMOJI_SEQUENCES.length;si++){
    var sq=EMOJI_SEQUENCES[si],baseHex=sq[0],seqHex=sq[1],catId=sq[2],sname=sq[3];
    var cp=parseInt(baseHex,16);
    var hexParts=seqHex.split(','),ch='';
    for(var pi=0;pi<hexParts.length;pi++)ch+=String.fromCodePoint(parseInt(hexParts[pi],16));
    var dup=false;for(var di=0;di<all.length;di++){if(all[di].cp===cp&&all[di].seqHex===seqHex){dup=true;break}}
    if(!dup)all.push({cp:cp,ch:ch,seqHex:seqHex,name:sname,cat:catId});
  }
  return all;
}

function filterPublicEmoji(cat,search){
  var all=genAllEmoji();
  var f=cat&&cat!=='all'?all.filter(function(it){return it.cat===cat}):all;
  var sl=(search||'').toLowerCase().trim();
  if(sl){
    var sc=parseInt(sl,16);
    f=f.filter(function(it){
      var h=it.cp.toString(16).toUpperCase();
      return it.name.toLowerCase().indexOf(sl)!==-1 || h.indexOf(sl.toUpperCase())!==-1 || (sc&&it.cp===sc) || (it.ch&&it.ch.indexOf(sl)!==-1) || (it.seqHex&&it.seqHex.indexOf(sl.toUpperCase())!==-1);
    });
  }
  return f;
}

function renderEmoji(){
  var grid=document.getElementById('emojiGrid');
  var search=state.emojiSearch,sub=state.emojiSub,countEl=document.getElementById('emojiResultCnt');
  if(sub==='public'){
    var filtered=filterPublicEmoji(state.emojiCat,search);
    state.totalCount=filtered.length;
    _startInfScroll('emojiGrid',filtered);
    countEl.textContent=state.totalCount.toLocaleString()+' 个';
  }else{
    var range=state.emojiPuaRange,r=EMOJI_PUA_RANGES[range];
    if(!r){grid.innerHTML='<div class="nohit">无效范围</div>';return}
    var searchL=(search||'').toLowerCase().trim();
    var allItems=null;
    if(searchL){
      allItems=[];var rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
      if(rM){var st=parseInt(rM[1],16),en=parseInt(rM[2],16);for(var j=Math.max(r.start,st);j<=Math.min(r.end,en);j++)allItems.push({cp:j,ch:String.fromCodePoint(j),name:getEmojiPuaName(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=r.start&&sc<=r.end)allItems.push({cp:sc,ch:String.fromCodePoint(sc),name:getEmojiPuaName(sc)})}
    }
    if(allItems){
      state.totalCount=allItems.length;
      _startInfScroll('emojiGrid',allItems);
    }else{
      state.totalCount=r.end-r.start+1;
      var allItems=[];
      for(var i=r.start;i<=r.end;i++)allItems.push({cp:i,ch:String.fromCodePoint(i),name:getEmojiPuaName(i)});
      _startInfScroll('emojiGrid',allItems);
    }
    countEl.textContent=state.totalCount.toLocaleString();
  }
}

// ── History ──
function renderHistory(){
  var grid=document.getElementById('histGrid');
  if(!state.history||!state.history.length){grid.innerHTML='<div class="hist-empty">还没有复制记录，点击任一符号即可添加</div>';return}
  var h='';
  for(var i=0;i<Math.min(state.history.length,30);i++){
    var it=state.history[i];
    h+='<div class="hist-item" data-idx="'+i+'"><span style="font-size:18px">'+it.ch+'</span><span style="font-size:10px;color:var(--m)">'+it.label+'</span><small style="font-size:9px;color:var(--m);cursor:pointer;margin-left:2px" class="hist-del" data-idx="'+i+'">✕</small></div>';
  }
  grid.innerHTML=h;
  grid.querySelectorAll('.hist-item').forEach(function(el){
    el.addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-idx')),item=state.history[idx];
      if(item)copyChar(item.ch,item.cp,item.hex,item.name);
    });
  });
  grid.querySelectorAll('.hist-del').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();var idx=parseInt(this.getAttribute('data-idx'));state.history.splice(idx,1);saveHistory();renderHistory()});
  });
}

// ── Toast ──
var toastTimer=null;
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('s');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('s')},1800)}
function copyChar(ch,cp,hex,name){
  navigator.clipboard.writeText(ch).then(function(){showToast('已复制 '+ch+'  ·  '+hex+'  '+(name||''))}).catch(function(){
    var ta=document.createElement('textarea');ta.value=ch;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('已复制 '+hex)}catch(e){showToast('复制失败')}
    document.body.removeChild(ta);
  });
  addHistory({ch:ch,cp:cp,hex:hex,label:'U+'+hex,name:name});
}

function updateBadges(){
  var ut=0;for(var i=0;i<PUBLIC_BLOCKS.length;i++)ut+=PUBLIC_BLOCKS[i].end-PUBLIC_BLOCKS[i].start+1;
  document.getElementById('unicodeBadge').textContent=ut.toLocaleString();
  var em=genAllEmoji();
  document.getElementById('emojiBadge').textContent=em.length.toLocaleString();
}

// Search
uSearch.addEventListener('input',function(){if(st)clearTimeout(st);var s=this;st=setTimeout(function(){state.unicodeSearch=s.value;renderUnicode()},250)});

document.getElementById('clearHistory').addEventListener('click',function(){if(state.history.length>0&&confirm('确认清空所有复制历史？')){clearHistory();showToast('历史已清空')}});

// Keyboard: Escape to clear search
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(state.tab==='unicode'&&state.unicodeSearch){state.unicodeSearch='';uSearch.value='';renderUnicode()}
    else if(state.tab==='emoji'&&state.emojiSearch){state.emojiSearch='';eSearch.value='';renderEmoji()}
  }
});

})();
