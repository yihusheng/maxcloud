<style>
:root{--cm:90px;--cg:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:11px 16px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;background:var(--s);color:var(--b)}
.tab:hover{background:var(--pp);color:var(--kd)}
.tab.act{background:var(--k);color:var(--p)}
.tab .badge{display:inline-block;background:rgba(159,232,112,.15);color:var(--p);padding:1px 7px;border-radius:999px;font-size:10px;margin-left:5px;vertical-align:middle}
.tab.act .badge{background:rgba(159,232,112,.15);color:var(--p)}
.stabs{display:flex;gap:4px;margin-bottom:12px}
.stab{flex:1;padding:8px 12px;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.12s;background:var(--c);color:var(--b);border:2px solid var(--s)}
.stab:hover{border-color:var(--pp);color:var(--kd)}
.stab.act{background:var(--s);color:var(--k);border-color:var(--s)}
.cpills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cpill{padding:5px 12px;border:2px solid var(--s);border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;transition:.12s;background:transparent;color:var(--b);font-family:inherit;white-space:nowrap}
.cpill:hover{border-color:var(--pp);color:var(--kd)}
.cpill.act{background:var(--k);color:var(--p);border-color:var(--k)}
.sb{display:flex;gap:8px;margin-bottom:10px}
.sb input{flex:1;height:40px;background:var(--c);border:2px solid var(--k);border-radius:12px;padding:0 12px;font-family:var(--f);font-size:13px;color:var(--k);outline:none}
.sb input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(159,232,112,.2)}
.sb .cnt{font-size:12px;font-weight:600;color:var(--m);display:flex;align-items:center;white-space:nowrap;padding:0 6px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cm),1fr));gap:var(--cg)}
.sc{background:var(--c);border-radius:14px;padding:7px 3px;text-align:center;cursor:pointer;transition:.1s;border:2px solid transparent;user-select:none}
.sc:hover{border-color:var(--p);background:var(--pp);transform:translateY(-1px)}
.sc:active{transform:scale(.94)}
.sc .ch{font-size:26px;line-height:1.2;min-height:1.2em;display:flex;align-items:center;justify-content:center;margin-bottom:1px;font-family:'Noto Sans Symbols','Segoe UI Symbol','Apple Symbols','Noto Sans Egyptian Hieroglyphs',sans-serif}
.sc .cp{font-size:8.5px;font-weight:700;color:var(--m);letter-spacing:-.15px;line-height:1.2}
.sc .nm{font-size:7.5px;color:var(--b);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-height:2.3em;margin-top:1px;word-break:break-all}
.pg{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:12px;flex-wrap:wrap}
.pg button{padding:5px 10px;border:2px solid var(--s);border-radius:8px;background:transparent;color:var(--b);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:.1s}
.pg button:hover{border-color:var(--pp);color:var(--kd)}
.pg button.act{background:var(--k);color:var(--p);border-color:var(--k)}
.pg .pg-info{font-size:11px;color:var(--m);margin:0 4px}
.hist{margin-top:16px;border-top:2px solid var(--s);padding-top:12px}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hist-hdr .lb{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--m);letter-spacing:.3px;display:flex;align-items:center;gap:4px}
.hist-hdr .lb .ms{font-size:13px}
.hist-hdr .clr{font-size:10px;color:var(--b);cursor:pointer;padding:2px 10px;border-radius:999px;border:1px solid var(--s);background:transparent;font-family:inherit;font-weight:600;transition:.12s}
.hist-hdr .clr:hover{background:var(--s);color:var(--neg)}
.hist-grid{display:flex;gap:5px;flex-wrap:wrap}
.hist-item{display:flex;align-items:center;gap:5px;background:var(--s);border-radius:10px;padding:3px 8px 3px 5px;cursor:pointer;transition:.1s}
.hist-item:hover{background:var(--pp)}
.hist-item .ch{font-size:16px;line-height:1}
.hist-item .cp{font-size:8px;color:var(--m);font-weight:600}
.hist-item .rm{color:var(--m);font-size:11px;cursor:pointer;padding:0 2px;opacity:.4}
.hist-item .rm:hover{color:var(--neg);opacity:1}
.hist-empty{font-size:11px;color:var(--m);padding:6px 0}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--p);padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.s{opacity:1}
.ld{text-align:center;padding:24px;color:var(--m);font-size:13px}
.ld .sp{display:inline-block;width:20px;height:20px;border:3px solid var(--pp);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.nohit{padding:16px;text-align:center;color:var(--neg);font-size:13px;background:var(--s);border-radius:14px;margin:8px 0}
.bdesc{font-size:11px;color:var(--m);margin-bottom:10px;line-height:1.4;padding:6px 10px;background:var(--c);border-radius:10px}
@media(max-width:520px){:root{--cm:74px}.sc .ch{font-size:20px}.sc .cp{font-size:7.5px}}
@media(min-width:768px){:root{--cm:96px}}
</style>
</head>

<div class="wrap" style="max-width:820px">

  <div class="card">
    <div class="card-hdr">
      <span class="dot"></span>
      <span class="lb">Unicode &amp; Emoji Browser</span>
      <span class="rt"><a href="/">← 首页</a></span>
    </div>
    <div class="card-pad" style="padding-bottom:24px">

      <h1 style="font-size:26px;margin-bottom:2px">Unicode 符号 &amp; Emoji</h1>
      <p class="sub" style="margin-bottom:12px">浏览符号与 Emoji，点击复制，历史记录自动保存</p>

      <div class="tabs" id="mainTabs">
        <button class="tab act" data-tab="unicode"><span class="material-symbols-rounded" style="font-size:15px;vertical-align:middle">abc</span> Unicode 符号 <span class="badge" id="unicodeBadge">—</span></button>
        <button class="tab" data-tab="emoji"><span class="material-symbols-rounded" style="font-size:15px;vertical-align:middle">mood</span> Emoji <span class="badge" id="emojiBadge">—</span></button>
      </div>

      <!-- ═══ UNICODE PANEL ═══ -->
      <div id="panelUnicode">
        <div class="stabs" id="unicodeSubTabs">
          <button class="stab act" data-sub="public">公共区</button>
          <button class="stab" data-sub="private">私人区 (PUA)</button>
        </div>
        <div id="unicodePublicCtr" style="display:block">
          <div class="cpills" id="unicodeBlockPills"></div>
          <div class="bdesc" id="unicodeBlockDesc"></div>
        </div>
        <div id="unicodePrivateCtr" style="display:none">
          <div class="cpills" id="unicodePuaPills">
            <button class="cpill act" data-range="bmp">BMP PUA <small>U+E000–U+F8FF</small></button>
            <button class="cpill" data-range="supa">Supp PUA-A <small>U+F0000–U+FFFFD</small></button>
            <button class="cpill" data-range="supb">Supp PUA-B <small>U+100000–U+10FFFD</small></button>
          </div>
          <div class="bdesc" id="unicodePuaDesc"></div>
        </div>
        <div class="sb">
          <input type="text" id="unicodeSearch" placeholder="搜索码点 (如 13000, 2200) 或范围 (如 13000-1342F)…" spellcheck="false">
          <span class="cnt" id="unicodeResultCnt"></span>
        </div>
        <div id="unicodeGrid"></div>
        <div class="pg" id="unicodePagination"></div>
      </div>

      <!-- ═══ EMOJI PANEL ═══ -->
      <div id="panelEmoji" style="display:none">
        <div class="stabs" id="emojiSubTabs">
          <button class="stab act" data-sub="public">公共区</button>
          <button class="stab" data-sub="private">私人区 (PUA)</button>
        </div>
        <div id="emojiPublicCtr" style="display:block">
          <div class="cpills" id="emojiCatPills"></div>
        </div>
        <div id="emojiPrivateCtr" style="display:none">
          <div class="cpills" id="emojiPuaPills">
            <button class="cpill act" data-range="zwj">ZWJ <small>U+200D</small></button>
            <button class="cpill" data-range="vs">异体选择符 <small>U+FE00–U+FE0F</small></button>
            <button class="cpill" data-range="tags">标签 Tags <small>U+E0020–U+E007F</small></button>
          </div>
          <div class="bdesc" style="color:var(--m);font-size:11px;margin-bottom:8px">Emoji 辅助字符：零宽连字、异体选择符、标签序列</div>
        </div>
        <div class="sb">
          <input type="text" id="emojiSearch" placeholder="搜索 emoji 名称或码点…" spellcheck="false">
          <span class="cnt" id="emojiResultCnt"></span>
        </div>
        <div id="emojiGrid"></div>
        <div class="pg" id="emojiPagination"></div>
      </div>

      <div class="hist" id="history">
        <div class="hist-hdr">
          <span class="lb"><span class="material-symbols-rounded ms">history</span> 复制历史</span>
          <button class="clr" id="clearHistory">清空</button>
        </div>
        <div class="hist-grid" id="histGrid"></div>
      </div>

    </div>
  </div>

  <div class="card-dark" style="padding:12px 24px;text-align:center">
    <p style="font-size:10px;color:rgba(232,235,230,.5)">Unicode Symbol &amp; Emoji Browser · <span id="footerCount">0</span> 个字符</p>
  </div>
</div>

<div class="toast" id="toast"></div>

function getCookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n.replace(/([.$?*|{}()[\]\\/+^])/g,'\\$1')+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}
function setCookie(n,v,d){var e=new Date();e.setDate(e.getDate()+d);document.cookie=n+'='+encodeURIComponent(v)+'; expires='+e.toUTCString()+'; path=/'}
function getPuaName(cp){return cp<=0xF8FF?'Private Use, BMP PUA':cp<=0xFFFFD?'Private Use, Supp PUA-A':'Private Use, Supp PUA-B'}
function getEmojiPuaName(cp){
  if(cp===0x200D)return 'Zero Width Joiner, Emoji ZWJ';
  if(cp>=0xFE00&&cp<=0xFE0F)return 'Variation Selector-'+(cp-0xFE00+1)+', Emoji Presentation';
  if(cp>=0xE0020&&cp<=0xE007F)return 'Tag '+(cp-0xE0020).toString()+', Emoji Tag Sequence';
  return 'Emoji Private Use';
}
function getEmojiName(cp){var h=cp.toString(16).toUpperCase();while(h.length>1&&h.charAt(0)==='0')h=h.substring(1);return EMOJI_NAMES[h]||''}
function isEmojiChar(cp){
  if(cp>=0x1F600&&cp<=0x1F64F)return 1;if(cp>=0x1F300&&cp<=0x1F5FF)return 1;if(cp>=0x1F680&&cp<=0x1F6FF)return 1;
  if(cp>=0x1F900&&cp<=0x1F9FF)return 1;if(cp>=0x1FA00&&cp<=0x1FA6F)return 1;if(cp>=0x1FA70&&cp<=0x1FAFF)return 1;

  if(cp>=0x1F490&&cp<=0x1F53F)return 1;if(cp>=0x2600&&cp<=0x27BF)return 1;if(cp>=0x231A&&cp<=0x23FF)return 1;
  if(cp===0x24C2)return 1;if(cp>=0x25AA&&cp<=0x25FE)return 1;if(cp>=0x2934&&cp<=0x2935)return 1;
  if(cp>=0x2B05&&cp<=0x2B55)return 1;if(cp>=0x3030&&cp<=0x303D)return 1;if(cp>=0x3297&&cp<=0x3299)return 1;
  if(cp>=0x1F9B0&&cp<=0x1F9FF)return 1;if(cp>=0x1FAB0&&cp<=0x1FABF)return 1;if(cp>=0x1FAC0&&cp<=0x1FACF)return 1;
  if(cp>=0x1FAD0&&cp<=0x1FAFF)return 1;if(cp>=0x1FAE0&&cp<=0x1FAEF)return 1;if(cp>=0x1FAF0&&cp<=0x1FAFF)return 1;
  if(cp>=0x1F9D1&&cp<=0x1F9DF)return 1;if(cp>=0x1F91A&&cp<=0x1F91F)return 1;if(cp>=0x1F932&&cp<=0x1F93F)return 1;
  if(cp>=0x1F940&&cp<=0x1F94F)return 1;if(cp>=0x1F950&&cp<=0x1F97F)return 1;if(cp>=0x1F980&&cp<=0x1F9AF)return 1;
  if(cp>=0x1F330&&cp<=0x1F37F)return 1;if(cp>=0x1F380&&cp<=0x1F3FF)return 1;if(cp>=0x1F468&&cp<=0x1F47F)return 1;
  if(cp>=0x1F480&&cp<=0x1F48F)return 1;if(cp>=0x1F500&&cp<=0x1F5FF)return 1;if(cp>=0x1F540&&cp<=0x1F55F)return 1;
  if(cp>=0x1F560&&cp<=0x1F57F)return 1;if(cp>=0x1F580&&cp<=0x1F59F)return 1;if(cp>=0x1F5A0&&cp<=0x1F5FF)return 1;
  return 0;

function loadHistory(){try{var r=getCookie('unicode_history');if(r){state.history=JSON.parse(r);if(!Array.isArray(state.history))state.history=[]}}catch(e){state.history=[]}}

function getPublicBlockItems(blockId,search){
  var blk;for(var i=0;i<PUBLIC_BLOCKS.length;i++){if(PUBLIC_BLOCKS[i].id===blockId){blk=PUBLIC_BLOCKS[i];break}}
  if(!blk)return{total:0,items:[]};
  var searchL=(search||'').toLowerCase().trim();
  if(searchL){
    var items=[],rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
    if(rM){var s=parseInt(rM[1],16),e=parseInt(rM[2],16);for(var j=Math.max(blk.start,s);j<=Math.min(blk.end,e);j++)items.push({cp:j,ch:String.fromCodePoint(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=blk.start&&sc<=blk.end)items.push({cp:sc,ch:String.fromCodePoint(sc)})}
    return{total:items.length,allItems:items,block:blk};
  }
  return{total:blk.end-blk.start+1,allItems:null,block:blk};
}
function getPuaItems(range,search){
  var r=PUA_RANGES[range];if(!r)return{total:0,items:[]};
  var searchL=(search||'').toLowerCase().trim();
  if(searchL){
    var items=[],rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
    if(rM){var s=parseInt(rM[1],16),e=parseInt(rM[2],16);for(var j=Math.max(r.start,s);j<=Math.min(r.end,e);j++)items.push({cp:j,ch:String.fromCodePoint(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=r.start&&sc<=r.end)items.push({cp:sc,ch:String.fromCodePoint(sc)})}
    return{total:items.length,allItems:items,range:r};
  }
  return{total:r.end-r.start+1,allItems:null,range:r};
}
function getPagedItems(total,allItems,rangeStart,rangeEnd,page,perPage){
  if(allItems){
    var pages=Math.ceil(allItems.length/perPage)||1;
    if(page>=pages)page=pages-1;
    var start=page*perPage,end=Math.min(start+perPage-1,allItems.length-1);
    return{items:allItems.slice(start,end+1),total:allItems.length,pages:pages,page:page};
  }
  var pages=Math.ceil(total/perPage);
  if(page>=pages)page=pages-1;
  var s=rangeStart+page*perPage,e=Math.min(s+perPage-1,rangeEnd),items=[];
  for(var i=s;i<=e;i++)items.push({cp:i,ch:String.fromCodePoint(i)});
  return{items:items,total:total,pages:pages,page:page};
}

var ALL_EMOJI=null;
function genAllEmoji(){
  if(ALL_EMOJI)return ALL_EMOJI;
  var all=[];
  for(var ci=0;ci<EMOJI_CATS.length;ci++){
    var cat=EMOJI_CATS[ci];
    if(cat.flagsOnly){
      var indivFlags=[{cp:0x1F3C1,name:'chequered flag'},{cp:0x1F3F3,name:'white flag'},{cp:0x1F3F4,name:'black flag'},{cp:0x1F6A9,name:'triangular flag'},{cp:0x1F38C,name:'crossed flags'}];
      for(var fi=0;fi<indivFlags.length;fi++){var f=indivFlags[fi];all.push({cp:f.cp,ch:String.fromCodePoint(f.cp),name:f.name,cat:'flags'})}
      for(var ci2=0;ci2<FLAG_COUNTRIES.length;ci2++){
        var fc=FLAG_COUNTRIES[ci2],code=fc[0],cname=fc[1];
        var ri1=0x1F1E6+code.charCodeAt(0)-65,ri2=0x1F1E6+code.charCodeAt(1)-65;
        all.push({cp:ri1,ch:String.fromCodePoint(ri1)+String.fromCodePoint(ri2),name:'flag: '+cname,code:code,cat:'flags',isPair:true});
      }
      continue;
    }
    for(var ri=0;ri<cat.ranges.length;ri++){
      var ra=cat.ranges[ri];
      for(var cp=ra[0];cp<=ra[1];cp++){
        var n=getEmojiName(cp);
        if(n||isEmojiChar(cp)){
          var dup=false;for(var di=0;di<all.length;di++){if(all[di].cp===cp){dup=true;break}}
          if(!dup)all.push({cp:cp,ch:String.fromCodePoint(cp),name:n,cat:cat.id});
        }
      }
    }
  }
  for(var hex in EMOJI_NAMES){
    var cp=parseInt(hex,16);var found=false;
    for(var i=0;i<all.length;i++){if(all[i].cp===cp){found=true;break}}
    if(!found&&isEmojiChar(cp))all.push({cp:cp,ch:String.fromCodePoint(cp),name:EMOJI_NAMES[hex],cat:'misc'});
  }
  ALL_EMOJI=all;return all;
}

function filterPublicEmoji(cat,search){
  var all=genAllEmoji();
  var f=cat&&cat!=='all'?all.filter(function(it){return it.cat===cat}):all;
  var sl=(search||'').toLowerCase().trim();
  if(sl){
    var sc=parseInt(sl,16);
    f=f.filter(function(it){
      var h=it.cp.toString(16).toUpperCase();
      return it.name.toLowerCase().indexOf(sl)!==-1||h.indexOf(sl.toUpperCase())!==-1||(sc&&it.cp===sc);
    });
  }
  return f;
}

function renderGrid(container,items,type){
  if(!items||!items.length){container.innerHTML='<div class="nohit">没有匹配的字符</div>';return}
  var html='<div class="sg">';
  for(var i=0;i<items.length;i++){
    var it=items[i],hex=it.cp.toString(16).toUpperCase();
    while(hex.length<4)hex='0'+hex;
    var name=it.name||'';
    if(!name)name=type==='pua'||type==='emoji-pua'?getPuaName(it.cp):'';
    html+='<div class="sc" data-cp="'+it.cp+'" data-type="'+type+'"><div class="ch">'+it.ch+'</div><div class="cp">U+'+hex+'</div><div class="nm">'+name+'</div></div>';
  }
  html+='</div>';container.innerHTML=html;
  var cells=container.querySelectorAll('.sc');
  for(var i=0;i<cells.length;i++)cells[i].addEventListener('click',function(e){
    var el=e.currentTarget,cp=parseInt(el.getAttribute('data-cp')),ch=String.fromCodePoint(cp);
    var hex=cp.toString(16).toUpperCase();while(hex.length<4)hex='0'+hex;
    var nm=el.querySelector('.nm').textContent;
    copyChar(ch,cp,hex,nm);
  });
}
function renderPagination(container,cp,tp,type){
  if(tp<=1){container.innerHTML='<span class="pg-info">共 1 页</span>';return}
  var html='<button data-p="0" data-t="'+type+'">«</button><button data-p="'+(cp-1)+'" data-t="'+type+'"'+(cp<=0?' disabled style="opacity:.3"':'')+'">‹</button>';
  html+='<span class="pg-info">'+(cp+1)+' / '+tp+'</span>';
  html+='<button data-p="'+(cp+1)+'" data-t="'+type+'"'+(cp>=tp-1?' disabled style="opacity:.3"':'')+'">›</button><button data-p="'+(tp-1)+'" data-t="'+type+'">»</button>';
  var ws=Math.max(0,cp-2),we=Math.min(tp-1,cp+2);
  for(var p=ws;p<=we;p++)html+='<button class="'+(p===cp?'act':'')+'" data-p="'+p+'" data-t="'+type+'">'+(p+1)+'</button>';
  container.innerHTML=html;
  container.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){
    var pg=parseInt(this.getAttribute('data-p')),t=this.getAttribute('data-t');
    if(isNaN(pg))return;
    if(t==='u'){state.unicodePage=pg;renderUnicode()}
    else if(t==='e'||t==='ep'){state.emojiPage=pg;renderEmoji()}
    document.getElementById(t==='u'||t==='up'?'unicodeGrid':'emojiGrid').scrollIntoView({behavior:'smooth',block:'start'});
  })});
}

function renderUnicode(){
  var grid=document.getElementById('unicodeGrid'),pg=document.getElementById('unicodePagination');
  var search=state.unicodeSearch,sub=state.unicodeSub,countEl=document.getElementById('unicodeResultCnt');
  if(sub==='public'){
    var blockData=getPublicBlockItems(state.publicBlock,search);
    document.getElementById('unicodeBlockDesc').textContent=(blockData.block?blockData.block.desc:'')+' · '+blockData.total.toLocaleString()+' 个字符';
    if(blockData.allItems){
      state.totalCount=blockData.allItems.length;
      var pages=Math.ceil(blockData.allItems.length/PER_PAGE)||1;
      if(state.unicodePage>=pages)state.unicodePage=0;
      var s=state.unicodePage*PER_PAGE,e=Math.min(s+PER_PAGE-1,blockData.allItems.length-1);
      renderGrid(grid,blockData.allItems.slice(s,e+1),sub);
      renderPagination(pg,state.unicodePage,pages,'u');
    }else{
      state.totalCount=blockData.total;
      var result=getPagedItems(blockData.total,null,blockData.block.start,blockData.block.end,state.unicodePage,PER_PAGE);
      renderGrid(grid,result.items,sub);
      renderPagination(pg,result.page,result.pages,'u');
    }
    countEl.textContent=state.totalCount.toLocaleString()+' 个';
  }else{
    var puaData=getPuaItems(state.privateRange,search);
    document.getElementById('unicodePuaDesc').textContent=puaData.range?puaData.range.desc:'';
    if(puaData.allItems){
      state.totalCount=puaData.allItems.length;
      var pages=Math.ceil(puaData.allItems.length/PER_PAGE)||1;
      if(state.unicodePage>=pages)state.unicodePage=0;
      var s=state.unicodePage*PER_PAGE,e=Math.min(s+PER_PAGE-1,puaData.allItems.length-1);
      renderGrid(grid,puaData.allItems.slice(s,e+1),'pua');
      renderPagination(pg,state.unicodePage,pages,'u');
    }else{
      state.totalCount=puaData.total;
      var result=getPagedItems(puaData.total,null,puaData.range.start,puaData.range.end,state.unicodePage,PER_PAGE);
      for(var i=0;i<result.items.length;i++)result.items[i].name=getPuaName(result.items[i].cp);
      renderGrid(grid,result.items,'pua');
      renderPagination(pg,result.page,result.pages,'u');
    }
    countEl.textContent=state.totalCount.toLocaleString()+' 个';
  }
  document.getElementById('footerCount').textContent=state.totalCount.toLocaleString();
  updateBadges();
}

function renderEmoji(){
  var grid=document.getElementById('emojiGrid'),pg=document.getElementById('emojiPagination');
  var search=state.emojiSearch,sub=state.emojiSub,countEl=document.getElementById('emojiResultCnt');
  if(sub==='public'){
    var filtered=filterPublicEmoji(state.emojiCat,search);
    state.totalCount=filtered.length;
    var pages=Math.ceil(filtered.length/PER_PAGE)||1;
    if(state.emojiPage>=pages)state.emojiPage=0;
    var s=state.emojiPage*PER_PAGE,e=Math.min(s+PER_PAGE-1,filtered.length-1);
    renderGrid(grid,filtered.slice(s,e+1),'emoji');
    renderPagination(pg,state.emojiPage,pages,'e');
  }else{
    var range=state.emojiPuaRange,r=EMOJI_PUA_RANGES[range];
    if(!r){grid.innerHTML='<div class="nohit">无效范围</div>';pg.innerHTML='';countEl.textContent='0';return}
    var searchL=(search||'').toLowerCase().trim();
    var allItems=null;
    if(searchL){
      allItems=[];var rM=searchL.match(/^([0-9a-f]+)\s*-\s*([0-9a-f]+)$/i);
      if(rM){var st=parseInt(rM[1],16),en=parseInt(rM[2],16);for(var j=Math.max(r.start,st);j<=Math.min(r.end,en);j++)allItems.push({cp:j,ch:String.fromCodePoint(j),name:getEmojiPuaName(j)})}else{var sc=parseInt(searchL,16);if(!isNaN(sc)&&sc>=r.start&&sc<=r.end)allItems.push({cp:sc,ch:String.fromCodePoint(sc),name:getEmojiPuaName(sc)})}
    }
    if(allItems){
      state.totalCount=allItems.length;
      var pages=Math.ceil(allItems.length/PER_PAGE)||1;
      if(state.emojiPage>=pages)state.emojiPage=0;
      var s=state.emojiPage*PER_PAGE,e=Math.min(s+PER_PAGE-1,allItems.length-1);
      renderGrid(grid,allItems.slice(s,e+1),'emoji-pua');
      renderPagination(pg,state.emojiPage,pages,'ep');
    }else{
      state.totalCount=r.end-r.start+1;
      var result=getPagedItems(r.end-r.start+1,null,r.start,r.end,state.emojiPage,PER_PAGE);
      for(var i=0;i<result.items.length;i++)result.items[i].name=getEmojiPuaName(result.items[i].cp);
      renderGrid(grid,result.items,'emoji-pua');
      renderPagination(pg,result.page,result.pages,'ep');
    }
    countEl.textContent=state.totalCount.toLocaleString();
  }
  document.getElementById('footerCount').textContent=state.totalCount.toLocaleString();
  updateBadges();
}

function renderHistory(){
  var grid=document.getElementById('histGrid');
  if(!state.history||!state.history.length){grid.innerHTML='<div class="hist-empty">还没有复制记录，点击任一符号即可添加</div>';return}
  var h='';
  for(var i=0;i<Math.min(state.history.length,30);i++){
    var it=state.history[i];
    h+='<div class="hist-item" data-idx="'+i+'"><span class="ch">'+it.ch+'</span><span class="cp">'+it.label+'</span><span class="rm" data-act="rm" data-idx="'+i+'">✕</span></div>';
  }
  grid.innerHTML=h;
  grid.querySelectorAll('.hist-item').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.getAttribute('data-act')==='rm')return;
      var idx=parseInt(this.getAttribute('data-idx')),item=state.history[idx];
      if(item)copyChar(item.ch,item.cp,item.hex,item.name);
    });
  });
  grid.querySelectorAll('.rm').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();var idx=parseInt(this.getAttribute('data-idx'));state.history.splice(idx,1);saveHistory();renderHistory()});
  });
}

var toastTimer=null;
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('s');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('s')},1800)}
function copyChar(ch,cp,hex,name){
  navigator.clipboard.writeText(ch).then(function(){showToast('已复制 '+ch+'  ·  '+hex+'  '+(name||''))}).catch(function(){
    var ta=document.createElement('textarea');ta.value=ch;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('已复制 '+hex)}catch(e){showToast('复制失败')}
    document.body.removeChild(ta);
  });
  addHistory({ch:ch,cp:cp,hex:hex,label:'U+'+hex,name:name});
}

function updateBadges(){
  var ut=0;for(var i=0;i<PUBLIC_BLOCKS.length;i++)ut+=PUBLIC_BLOCKS[i].end-PUBLIC_BLOCKS[i].start+1;
  document.getElementById('unicodeBadge').textContent=ut.toLocaleString();
  var em=genAllEmoji();
  document.getElementById('emojiBadge').textContent=em.length.toLocaleString();
}

function init(){
  loadHistory();
  var mt=document.querySelectorAll('#mainTabs .tab');
  mt.forEach(function(t){t.addEventListener('click',function(){
    mt.forEach(function(x){x.classList.remove('act')});this.classList.add('act');
    state.tab=this.getAttribute('data-tab');
    document.getElementById('panelUnicode').style.display=state.tab==='unicode'?'':'none';
    document.getElementById('panelEmoji').style.display=state.tab==='emoji'?'':'none';
  })});
  var us=document.querySelectorAll('#unicodeSubTabs .stab');
  us.forEach(function(t){t.addEventListener('click',function(){
    us.forEach(function(x){x.classList.remove('act')});this.classList.add('act');
    state.unicodeSub=this.getAttribute('data-sub');
    state.unicodePage=0;state.unicodeSearch='';document.getElementById('unicodeSearch').value='';
    document.getElementById('unicodePublicCtr').style.display=state.unicodeSub==='public'?'block':'none';
    document.getElementById('unicodePrivateCtr').style.display=state.unicodeSub==='private'?'block':'none';
    renderUnicode();
  })});
  var es=document.querySelectorAll('#emojiSubTabs .stab');
  es.forEach(function(t){t.addEventListener('click',function(){
    es.forEach(function(x){x.classList.remove('act')});this.classList.add('act');
    state.emojiSub=this.getAttribute('data-sub');
    state.emojiPage=0;state.emojiSearch='';document.getElementById('emojiSearch').value='';
    document.getElementById('emojiPublicCtr').style.display=state.emojiSub==='public'?'block':'none';
    document.getElementById('emojiPrivateCtr').style.display=state.emojiSub==='private'?'block':'none';
    if(state.emojiSub==='private'&&!state.emojiPuaRange)state.emojiPuaRange='zwj';
    renderEmoji();
  })});
  (function buildBlockPills(){
    var c=document.getElementById('unicodeBlockPills');
    var h='';for(var i=0;i<PUBLIC_BLOCKS.length;i++){var b=PUBLIC_BLOCKS[i],a=b.id===state.publicBlock?' act':'';h+='<button class="cpill'+a+'" data-blk="'+b.id+'">'+b.label+'</button>'}
    c.innerHTML=h;
    c.querySelectorAll('.cpill').forEach(function(p){p.addEventListener('click',function(){
      c.querySelectorAll('.cpill').forEach(function(x){x.classList.remove('act')});this.classList.add('act');
      state.publicBlock=this.getAttribute('data-blk');state.unicodePage=0;renderUnicode();
    })});
  })();
  document.querySelectorAll('#unicodePuaPills .cpill').forEach(function(p){p.addEventListener('click',function(){
    document.querySelectorAll('#unicodePuaPills .cpill').forEach(function(x){x.classList.remove('act')});this.classList.add('act');
    state.privateRange=this.getAttribute('data-range');state.unicodePage=0;renderUnicode();
  })});
  (function buildEmojiCats(){
    var c=document.getElementById('emojiCatPills');
    var h='<button class="cpill act" data-cat="all">全部</button>';
    for(var i=0;i<EMOJI_CATS.length;i++)h+='<button class="cpill" data-cat="'+EMOJI_CATS[i].id+'">'+EMOJI_CATS[i].label+'</button>';
    c.innerHTML=h;
    c.querySelectorAll('.cpill').forEach(function(p){p.addEventListener('click',function(){
      c.querySelectorAll('.cpill').forEach(function(x){x.classList.remove('act')});this.classList.add('act');
      state.emojiCat=this.getAttribute('data-cat');state.emojiPage=0;renderEmoji();
    })});
  })();
  document.querySelectorAll('#emojiPuaPills .cpill').forEach(function(p){p.addEventListener('click',function(){
    document.querySelectorAll('#emojiPuaPills .cpill').forEach(function(x){x.classList.remove('act')});this.classList.add('act');
    state.emojiPuaRange=this.getAttribute('data-range');state.emojiPage=0;renderEmoji();
  })});
  var uSearch=document.getElementById('unicodeSearch'),eSearch=document.getElementById('emojiSearch');
  var st=null;
  uSearch.addEventListener('input',function(){if(st)clearTimeout(st);var s=this;st=setTimeout(function(){state.unicodeSearch=s.value;state.unicodePage=0;renderUnicode()},250)});
  eSearch.addEventListener('input',function(){if(st)clearTimeout(st);var s=this;st=setTimeout(function(){state.emojiSearch=s.value;state.emojiPage=0;renderEmoji()},250)});
  document.getElementById('clearHistory').addEventListener('click',function(){if(state.history.length>0&&confirm('确认清空所有复制历史？')){clearHistory();showToast('历史已清空')}});
  renderUnicode();renderHistory();updateBadges();
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(state.tab==='unicode'&&state.unicodeSearch){state.unicodeSearch='';uSearch.value='';state.unicodePage=0;renderUnicode()}
      else if(state.tab==='emoji'&&state.emojiSearch){state.emojiSearch='';eSearch.value='';state.emojiPage=0;renderEmoji()}
    }
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
