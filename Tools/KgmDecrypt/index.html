<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KGM 解密 — Wise</title>
<meta name="description" content="在浏览器端解密酷狗KGM加密音乐，不上传文件，保护隐私">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --success: #22c55e;
  --success-bg: #f0fdf4;
  --error: #ef4444;
  --error-bg: #fef2f2;
  --border: #e5e7eb;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --surface: #1f2937;
    --text: #f3f4f6;
    --text-secondary: #9ca3af;
    --accent: #a78bfa;
    --accent-hover: #c4b5fd;
    --border: #374151;
    --shadow: 0 2px 12px rgba(0,0,0,.2);
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
  -webkit-font-smoothing: antialiased;
}

.container { max-width: 580px; width: 100%; }

/* ── Header ── */
.header { text-align: center; margin-bottom: 2rem; }
.header h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -.02em;
}
.header p {
  color: var(--text-secondary);
  font-size: .95rem;
  margin-top: .4rem;
}
.header .badge {
  display: inline-block;
  margin-top: .6rem;
  padding: .2rem .7rem;
  background: var(--accent);
  color: #fff;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
}

/* ── Drop Zone ── */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 3rem 2rem;
  text-align: center;
  background: var(--surface);
  cursor: pointer;
  transition: all .25s;
  box-shadow: var(--shadow);
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
.drop-zone .icon { font-size: 2.5rem; margin-bottom: .5rem; }
.drop-zone .desc { font-weight: 600; margin-bottom: .3rem; }
.drop-zone .hint { color: var(--text-secondary); font-size: .85rem; }

/* ── File Info ── */
.file-info {
  margin: 1rem 0;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: none;
  align-items: center;
  gap: .75rem;
}
.file-info.show { display: flex; }
.file-info .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-info .size { color: var(--text-secondary); font-size: .85rem; white-space: nowrap; }
.file-info .remove {
  color: var(--text-secondary);
  cursor: pointer;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: all .15s;
  font-size: 1.1rem;
}
.file-info .remove:hover { background: var(--error-bg); color: var(--error); }

/* ── Button ── */
.btn {
  display: block; width: 100%;
  padding: .9rem 1.5rem;
  border: none; border-radius: 12px;
  font-family: var(--font);
  font-size: 1rem; font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.btn-primary {
  background: var(--accent); color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn:not(:disabled):active { transform: scale(.98); }

/* ── Progress ── */
.progress-area {
  margin-top: 1.5rem;
  display: none;
}
.progress-area.show { display: block; }

.progress-step {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .75rem 1rem;
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
  margin-bottom: .5rem;
}
.progress-step .step-icon {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem;
  flex-shrink: 0;
}
.progress-step .step-icon.pending { border: 2px solid var(--border); }
.progress-step .step-icon.active { border: 2px solid var(--accent); border-top-color: transparent; animation: spin .6s linear infinite; }
.progress-step .step-icon.done { background: var(--success); color: #fff; }
.progress-step .step-label { flex: 1; font-size: .9rem; font-weight: 500; }
.progress-step .step-meta { color: var(--text-secondary); font-size: .82rem; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Result ── */
.result {
  margin-top: 1.5rem;
  padding: 1.25rem;
  background: var(--success-bg);
  border: 1px solid var(--success);
  border-radius: var(--radius);
  display: none;
  align-items: center;
  gap: 1rem;
}
.result.show { display: flex; }
.result .icon { font-size: 1.5rem; }
.result .info { flex: 1; min-width: 0; }
.result .info .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result .info .meta { color: var(--text-secondary); font-size: .85rem; margin-top: .2rem; }
.result .download-btn {
  background: var(--success);
  color: #fff;
  padding: .5rem 1rem;
  border-radius: 8px;
  text-decoration: none;
  font-size: .9rem;
  font-weight: 600;
  white-space: nowrap;
  transition: .15s;
}
.result .download-btn:hover { filter: brightness(1.1); }

/* ── Error ── */
.error {
  margin-top: 1.5rem;
  padding: 1rem 1.25rem;
  background: var(--error-bg);
  border: 1px solid var(--error);
  border-radius: 12px;
  color: var(--error);
  display: none;
  font-size: .9rem;
  line-height: 1.5;
}
.error.show { display: block; }

/* ── Note ── */
.note {
  margin-top: 2rem;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: var(--shadow);
  font-size: .85rem;
  color: var(--text-secondary);
  line-height: 1.7;
}
.note strong { color: var(--text); }
.note code {
  background: var(--bg);
  padding: .1em .4em;
  border-radius: 4px;
  font-size: .82em;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎵 KGM 解密</h1>
    <p>在浏览器中解密酷狗加密音乐，文件不上传服务器</p>
    <span class="badge">纯本地运算</span>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="icon">📂</div>
    <div class="desc">拖拽 KGM 文件到此处</div>
    <div class="hint">或点击选择 · 支持 .kgm .kgm.flac .kgma</div>
    <input type="file" id="fileInput" accept=".kgm,.kgma,.kgm.flac,.kgma.flac" hidden>
  </div>

  <div class="file-info" id="fileInfo">
    <span>📄</span>
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
    <span class="remove" id="removeFile">✕</span>
  </div>

  <button class="btn btn-primary" id="decryptBtn" disabled>开始解密</button>

  <div class="progress-area" id="progressArea">
    <div class="progress-step" id="stepRead">
      <span class="step-icon pending" id="iconRead">○</span>
      <span class="step-label">读取文件</span>
      <span class="step-meta" id="metaRead"></span>
    </div>
    <div class="progress-step" id="stepKey">
      <span class="step-icon pending" id="iconKey">○</span>
      <span class="step-label">获取密钥段</span>
      <span class="step-meta" id="metaKey"></span>
    </div>
    <div class="progress-step" id="stepDecrypt">
      <span class="step-icon pending" id="iconDecrypt">○</span>
      <span class="step-label">解密中</span>
      <span class="step-meta" id="metaDecrypt"></span>
    </div>
  </div>

  <div class="result" id="result">
    <span class="icon">✅</span>
    <div class="info">
      <div class="name" id="resultName"></div>
      <div class="meta" id="resultMeta"></div>
    </div>
    <a class="download-btn" id="downloadBtn" download>下载</a>
  </div>

  <div class="error" id="error"></div>

  <div class="note">
    <strong>说明</strong><br>
    • 文件在浏览器本地处理，<strong>不会上传</strong>到任何服务器<br>
    • 仅从服务器获取所需的密钥段（几十KB~几MB）<br>
    • 解密后自动识别格式（MP3/FLAC/OGG/WAV）<br>
    • 文件名自动去除 <code>_HQ</code> <code>_SQ</code> 等质量后缀
  </div>
</div>

<script>
// ── 常量 ──
const KGM_MAGIC = new Uint8Array([
  0x7c,0xd5,0x32,0xeb,0x86,0x02,0x7f,0x4b,
  0xa8,0xaf,0xa6,0x8e,0x0f,0xff,0x99,0x14,
  0x00,0x04,0x00,0x00,0x03,0x00,0x00,0x00,
  0x01,0x00,0x00,0x00,
]);
const HEADER_LEN = 1024;
const OWN_KEY_LEN = 17;
const KEY_SLOT_SIZE = 16;

const PUB_KEY_MEND = new Uint8Array([
  0xB8,0xD5,0x3D,0xB2,0xE9,0xAF,0x78,0x8C,0x83,0x33,0x71,0x51,0x76,0xA0,
  0xCD,0x37,0x2F,0x3E,0x35,0x8D,0xA9,0xBE,0x98,0xB7,0xE7,0x8C,0x22,0xCE,
  0x5A,0x61,0xDF,0x68,0x69,0x89,0xFE,0xA5,0xB6,0xDE,0xA9,0x77,0xFC,0xC8,
  0xBD,0xBD,0xE5,0x6D,0x3E,0x5A,0x36,0xEF,0x69,0x4E,0xBE,0xE1,0xE9,0x66,
  0x1C,0xF3,0xD9,0x02,0xB6,0xF2,0x12,0x9B,0x44,0xD0,0x6F,0xB9,0x35,0x89,
  0xB6,0x46,0x6D,0x73,0x82,0x06,0x69,0xC1,0xED,0xD7,0x85,0xC2,0x30,0xDF,
  0xA2,0x62,0xBE,0x79,0x2D,0x62,0x62,0x3D,0x0D,0x7E,0xBE,0x48,0x89,0x23,
  0x02,0xA0,0xE4,0xD5,0x75,0x51,0x32,0x02,0x53,0xFD,0x16,0x3A,0x21,0x3B,
  0x16,0x0F,0xC3,0xB2,0xBB,0xB3,0xE2,0xBA,0x3A,0x3D,0x13,0xEC,0xF6,0x01,
  0x45,0x84,0xA5,0x70,0x0F,0x93,0x49,0x0C,0x64,0xCD,0x31,0xD5,0xCC,0x4C,
  0x07,0x01,0x9E,0x00,0x1A,0x23,0x90,0xBF,0x88,0x1E,0x3B,0xAB,0xA6,0x3E,
  0xC4,0x73,0x47,0x10,0x7E,0x3B,0x5E,0xBC,0xE3,0x00,0x84,0xFF,0x09,0xD4,
  0xE0,0x89,0x0F,0x5B,0x58,0x70,0x4F,0xFB,0x65,0xD8,0x5C,0x53,0x1B,0xD3,
  0xC8,0xC6,0xBF,0xEF,0x98,0xB0,0x50,0x4F,0x0F,0xEA,0xE5,0x83,0x58,0x8C,
  0x28,0x2C,0x84,0x67,0xCD,0xD0,0x9E,0x47,0xDB,0x27,0x50,0xCA,0xF4,0x63,
  0x63,0xE8,0x97,0x7F,0x1B,0x4B,0x0C,0xC2,0xC1,0x21,0x4C,0xCC,0x58,0xF5,
  0x94,0x52,0xA3,0xF3,0xD3,0xE0,0x68,0xF4,0x00,0x23,0xF3,0x5E,0x0A,0x7B,
  0x93,0xDD,0xAB,0x12,0xB2,0x13,0xE8,0x84,0xD7,0xA7,0x9F,0x0F,0x32,0x4C,
  0x55,0x1D,0x04,0x36,0x52,0xDC,0x03,0xF3,0xF9,0x4E,0x42,0xE9,0x3D,0x61,
  0xEF,0x7C,0xB6,0xB3,0x93,0x50,
]);
const MEND_LEN = PUB_KEY_MEND.length;

// ── DOM ──
const $ = id => document.getElementById(id);
const el = {
  dropZone: $('dropZone'), fileInput: $('fileInput'),
  fileInfo: $('fileInfo'), fileName: $('fileName'), fileSize: $('fileSize'),
  removeFile: $('removeFile'), decryptBtn: $('decryptBtn'),
  progressArea: $('progressArea'),
  stepRead: $('stepRead'), stepKey: $('stepKey'), stepDecrypt: $('stepDecrypt'),
  iconRead: $('iconRead'), iconKey: $('iconKey'), iconDecrypt: $('iconDecrypt'),
  metaRead: $('metaRead'), metaKey: $('metaKey'), metaDecrypt: $('metaDecrypt'),
  result: $('result'), resultName: $('resultName'), resultMeta: $('resultMeta'),
  downloadBtn: $('downloadBtn'), error: $('error'),
};

let selectedFile = null;

// ── 文件选择 ──
el.dropZone.addEventListener('click', () => el.fileInput.click());
el.dropZone.addEventListener('dragover', e => { e.preventDefault(); el.dropZone.classList.add('dragover'); });
el.dropZone.addEventListener('dragleave', () => el.dropZone.classList.remove('dragover'));
el.dropZone.addEventListener('drop', e => { e.preventDefault(); el.dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
el.fileInput.addEventListener('change', () => { if (el.fileInput.files.length) handleFile(el.fileInput.files[0]); });
el.removeFile.addEventListener('click', reset);
el.decryptBtn.addEventListener('click', decrypt);

function handleFile(f) {
  const name = f.name;
  if (!/\.kgm(\.(flac|mp3))?$|\.kgma(\.(flac|mp3))?$/i.test(name)) {
    return showError('不支持的文件格式，请选择 .kgm 文件');
  }
  selectedFile = f;
  el.fileName.textContent = name;
  el.fileSize.textContent = formatSize(f.size);
  el.fileInfo.classList.add('show');
  el.decryptBtn.disabled = false;
  el.result.classList.remove('show');
  el.error.classList.remove('show');
  el.progressArea.classList.remove('show');
}

function reset() {
  selectedFile = null;
  el.fileInput.value = '';
  el.fileInfo.classList.remove('show');
  el.decryptBtn.disabled = true;
  el.result.classList.remove('show');
  el.error.classList.remove('show');
  el.progressArea.classList.remove('show');
}

function setStep(stepEl, iconEl, state, label, meta) {
  if (state === 'active') {
    iconEl.className = 'step-icon active';
    iconEl.textContent = '';
  } else if (state === 'done') {
    iconEl.className = 'step-icon done';
    iconEl.textContent = '✓';
  } else {
    iconEl.className = 'step-icon pending';
    iconEl.textContent = '○';
  }
  if (label) stepEl.querySelector('.step-label').textContent = label;
  if (meta !== undefined) stepEl.querySelector('.step-meta').textContent = meta;
}

function resetSteps() {
  el.progressArea.classList.remove('show');
  setStep(el.stepRead, el.iconRead, 'pending', '读取文件', '');
  setStep(el.stepKey, el.iconKey, 'pending', '获取密钥段', '');
  setStep(el.stepDecrypt, el.iconDecrypt, 'pending', '解密中', '');
}

// ── 解密 ──
async function decrypt() {
  if (!selectedFile) return;

  resetSteps();
  el.progressArea.classList.add('show');
  el.result.classList.remove('show');
  el.error.classList.remove('show');
  el.decryptBtn.disabled = true;

  try {
    // 1. 读取文件
    setStep(el.stepRead, el.iconRead, 'active', '读取文件...', '');
    const fileBuf = await selectedFile.arrayBuffer();
    const data = new Uint8Array(fileBuf);
    setStep(el.stepRead, el.iconRead, 'done', '文件已读取', formatSize(data.length));
    await sleep(50);

    // 2. 验证魔数
    for (let i = 0; i < 28; i++) {
      if (data[i] !== KGM_MAGIC[i]) throw new Error('无效的 KGM 文件');
    }

    // 3. 提取 own_key
    const ownKey = new Uint8Array(OWN_KEY_LEN);
    ownKey.set(data.subarray(0x1c, 0x2c));

    const offset = HEADER_LEN;
    const audioLen = data.length - offset;
    const slotsNeeded = Math.ceil(audioLen / KEY_SLOT_SIZE);

    // 4. 获取密钥段
    setStep(el.stepKey, el.iconKey, 'active', '获取密钥段...', '');
    const keyResp = await fetch(`/api/decrypt-key?slots=0&count=${slotsNeeded}`);
    if (!keyResp.ok) throw new Error('密钥获取失败: ' + (await keyResp.text()));
    const keyBuf = await keyResp.arrayBuffer();
    const keyTable = new Uint8Array(keyBuf);
    setStep(el.stepKey, el.iconKey, 'done', '密钥段已获取', formatSize(keyBuf.byteLength));
    await sleep(50);

    // 5. 解密
    setStep(el.stepDecrypt, el.iconDecrypt, 'active', '解密中...', '');

    // 使用 setTimeout 分块处理，避免阻塞 UI
    const CHUNK = 512 * 1024;
    const output = new Uint8Array(audioLen);
    let processed = 0;

    while (processed < audioLen) {
      const end = Math.min(processed + CHUNK, audioLen);
      for (let j = processed; j < end; j++) {
        const i = j;
        const enc = data[offset + j];

        // own_key
        let ok = ownKey[i % OWN_KEY_LEN] ^ enc;
        ok = (ok ^ ((ok & 0x0f) << 4)) & 0xff;

        // pub_key
        const slot = Math.floor(i / KEY_SLOT_SIZE);
        let pk = PUB_KEY_MEND[i % MEND_LEN] ^ keyTable[slot];
        pk = (pk ^ ((pk & 0x0f) << 4)) & 0xff;

        output[j] = ok ^ pk;
      }
      processed = end;

      // 让出主线程处理 UI 更新
      if (processed < audioLen) {
        setStep(el.stepDecrypt, el.iconDecrypt, 'active', `解密中… ${Math.round(processed * 100 / audioLen)}%`, '');
        await sleep(0);
      }
    }

    setStep(el.stepDecrypt, el.iconDecrypt, 'done', '解密完成', formatSize(output.length));
    await sleep(50);

    // 6. 检测格式
    const fmt = detectFormat(output);
    const ext = fmt ? fmt.ext : 'bin';
    const mime = fmt ? fmt.mime : 'application/octet-stream';

    // 7. 清理文件名
    const cleanName = cleanFilename(selectedFile.name);

    // 8. 显示结果
    const finalName = /\.[\w]+$/.test(cleanName) ? cleanName : cleanName + '.' + ext;
    const blob = new Blob([output], { type: mime });
    const url = URL.createObjectURL(blob);

    el.resultName.textContent = finalName;
    el.resultMeta.textContent = formatSize(output.length) + ' · ' + (fmt ? fmt.ext.toUpperCase() : '?');
    el.downloadBtn.href = url;
    el.downloadBtn.download = finalName;
    el.result.classList.add('show');
    el.decryptBtn.disabled = false;

  } catch (err) {
    showError(err.message || '解密失败');
    el.progressArea.classList.remove('show');
    el.decryptBtn.disabled = false;
  }
}

// ── 辅助 ──
function detectFormat(head) {
  if (head[0] === 0xFF && (head[1] & 0xE0) === 0xE0) return { ext: 'mp3', mime: 'audio/mpeg' };
  if (head[0] === 0x66 && head[1] === 0x4C && head[2] === 0x61 && head[3] === 0x43) return { ext: 'flac', mime: 'audio/flac' };
  if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) return { ext: 'mp3', mime: 'audio/mpeg' };
  if (head[0] === 0x4F && head[1] === 0x67 && head[2] === 0x67 && head[3] === 0x53) return { ext: 'ogg', mime: 'audio/ogg' };
  if (head[0] === 0x52 && head[1] === 0x49 && head[2] === 0x46 && head[3] === 0x46) return { ext: 'wav', mime: 'audio/wav' };
  return null;
}

function cleanFilename(name) {
  let base = name;
  for (const ext of ['.kgm.flac', '.kgm.mp3', '.kgma.flac', '.kgma', '.kgm']) {
    if (base.toLowerCase().endsWith(ext)) { base = base.slice(0, -ext.length); break; }
  }
  base = base.replace(/_(HQ|SQ|HiRes|HD|无损|高品质|标准|流畅)\s*$/i, '');
  base = base.replace(/\s*\([^)]*\)\s*$/, '');
  return base.trim();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showError(msg) {
  el.error.textContent = '❌ ' + msg;
  el.error.classList.add('show');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
