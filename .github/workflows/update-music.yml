name: Music Pipeline
on:
  push:
    paths:
      # 音频：大小写都要匹配（.mp3 / .MP3 / .Mp3 ...）
      - 'public/music/*.[mM][pP]3'
      - 'public/music/*.[fF][lL][aA][cC]'
      - 'public/music/*.[mM]4[aA]'
      - 'public/music/*.[oO][gG][gG]'
      - 'public/music/*.[wW][aA][vV]'
      - 'public/music/*.[aA][aA][cC]'
      - 'public/music/*.kgm'
      - 'public/music/*.kgm.flac'
      - '.github/scripts/generate-music.js'
      - '.github/scripts/sync-r2.py'
      - '.github/scripts/decrypt_kgm.py'
      - '.github/scripts/kugou_key.xz'
      - '.github/workflows/update-music.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: music-pipeline
  cancel-in-progress: false

env:
  BUCKET: maxcloud

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decrypt KGM files
        run: |
          # 大小写不敏感匹配（macOS/Windows 上传的 .KGM 也要处理）
          mapfile -t kgm_files < <(find public/music -maxdepth 1 -type f \
            \( -iname '*.kgm' -o -iname '*.kgm.flac' \) 2>/dev/null | sort)
          count=${#kgm_files[@]}
          if [ "$count" -gt 0 ]; then
            echo "Found $count KGM file(s), decrypting..."
            python3 .github/scripts/decrypt_kgm.py "${kgm_files[@]}"
            rm -f "${kgm_files[@]}"
            echo "kgm_decrypted=true" >> "$GITHUB_ENV"
          else
            echo "No KGM files found"
            echo "kgm_decrypted=false" >> "$GITHUB_ENV"
          fi

      - name: Check for local audio files
        id: check
        run: |
          # 大小写不敏感：.mp3 / .MP3 / .Mp3 / .FLAC / .M4A ... 全部计入
          mapfile -t audio_files < <(find public/music -maxdepth 1 -type f \
            \( -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
               -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.aac' \) 2>/dev/null | sort)
          count=${#audio_files[@]}
          has_new=false
          [ "$count" -gt 0 ] && has_new=true
          echo "has_new=$has_new" >> "$GITHUB_OUTPUT"
          echo "Found $count local audio files"
          printf '  %s\n' "${audio_files[@]:-}"

      - name: Sync & verify from R2
        id: sync
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 .github/scripts/sync-r2.py

      - name: Download current music_list.js from R2 (for merge)
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -f scripts/music_list.js ]; then python3 .github/scripts/sync-r2.py download; fi

      - name: Install deps
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: |
          npm install music-metadata
          pip install mutagen -q 2>&1 | tail -1 || true

      - name: Ensure public/music directory exists
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: mkdir -p public/music

      - name: Generate music_list.js + extract covers + lyrics
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: node .github/scripts/generate-music.js

      - name: Upload all files to R2
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # nocaseglob：让 *.mp3 同时匹配 .MP3 / .Mp3 等，
          # 修复「大写扩展名文件跳过上传，随后被清理步骤删除」导致音频丢失的问题
          shopt -s nullglob nocaseglob
          TOKEN="$CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"

          # 静默安装 wrangler，失败不阻断
          npm install -g wrangler --silent 2>&1 | tail -1 || true

          upload() {
            local file="$1" ct="$2"
            # 避免 'file' 内含单引号破坏 python3 -c 的引用
            encoded=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "$file")
            local url="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${encoded}"
            http_code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${ct}" \
              --data-binary @"${file}" \
              "${url}")
            if [ "$http_code" != "200" ]; then
              # curl 直传失败 → 尝试 wrangler，仍失败则记录
              if ! wrangler r2 object put "${BUCKET}/${file}" --file="${file}" >/dev/null 2>&1; then
                echo "  ❌ upload failed: ${file} (curl HTTP ${http_code})" >&2
                return 1
              fi
            fi
            echo "  uploaded $file"
          }
          export -f upload
          export TOKEN ACCOUNT_ID BUCKET

          failed=0
          for ext in mp3:audio/mpeg flac:audio/flac m4a:audio/mp4 ogg:audio/ogg wav:audio/wav aac:audio/aac \
                     lrc:text/plain\;\ charset=utf-8 jpg:image/jpeg jpeg:image/jpeg png:image/png json:application/json; do
            ext_name="${ext%%:*}"
            content_type="${ext#*:}"
            for f in public/music/*."$ext_name"; do
              [ -f "$f" ] || continue
              upload "$f" "$content_type" || failed=$((failed+1))
            done
          done

          # 上传失败 → 中止，避免随后的清理步骤把未上传的文件删掉
          if [ "$failed" -gt 0 ]; then
            echo "❌ ${failed} 个文件上传失败，中止以免丢失文件" >&2
            exit 1
          fi
          echo "✅ 全部文件上传完成"

      - name: Upload music_list.js to R2
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/sync-r2.py upload

      - name: Verify every audio file landed in R2
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 清理前先确认每个本地音频都已在 R2，防止「删了但没传」
          set -uo pipefail
          shopt -s nullglob nocaseglob
          missing=0
          for f in public/music/*.mp3 public/music/*.flac public/music/*.m4a \
                   public/music/*.ogg public/music/*.wav public/music/*.aac; do
            [ -f "$f" ] || continue
            encoded=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "$f")
            code=$(curl -s -o /dev/null -w "%{http_code}" -I \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${encoded}")
            if [ "$code" != "200" ]; then
              echo "❌ 未在 R2 找到: ${f} (HTTP ${code})" >&2
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "❌ ${missing} 个音频未成功入库，跳过清理以免丢失" >&2
            exit 1
          fi
          echo "✅ R2 校验通过，可以安全清理本地文件"

      - name: Clean repo — delete all processed files (audio/covers/lyrics/music_list)
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: |
          # 全部已上传 R2 并通过校验 → 从 repo 彻底删除
          shopt -s nullglob nocaseglob
          rm -f public/music/*.mp3
          rm -f public/music/*.flac
          rm -f public/music/*.m4a
          rm -f public/music/*.ogg
          rm -f public/music/*.wav
          rm -f public/music/*.aac
          rm -f public/music/*.jpg public/music/*.jpeg
          rm -f public/music/*.png
          rm -f public/music/*.lrc
          rm -f scripts/music_list.js

      - name: Commit cleanup — only .gitkeep remains
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          touch public/music/.gitkeep
          git add public/music/.gitkeep
          git add -A
          git diff --cached --quiet || git commit -m "cleanup: remove processed files from repo [skip ci]"
          git push

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        uses: actions/deploy-pages@v4
