name: Music Pipeline
on:
  push:
    paths:
      - 'public/music/*.mp3'
      - 'public/music/*.flac'
      - 'public/music/*.m4a'
      - 'public/music/*.ogg'
      - 'public/music/*.wav'
      - 'public/music/*.aac'
      - 'public/music/*.kgm'
      - 'public/music/*.kgm.flac'
      - 'generate-music.js'
      - 'sync-r2.py'
      - 'decrypt_kgm.py'
      - 'kugou_key.xz'
      - '.github/workflows/update-music.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: music-pipeline
  cancel-in-progress: false

env:
  BUCKET: maxcloud

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decrypt KGM files
        run: |
          count=$(ls public/music/*.kgm public/music/*.kgm.flac 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count KGM file(s), decrypting..."
            python3 decrypt_kgm.py public/music/*.kgm public/music/*.kgm.flac
            rm -f public/music/*.kgm public/music/*.kgm.flac
            echo "kgm_decrypted=true" >> "$GITHUB_ENV"
          else
            echo "No KGM files found"
            echo "kgm_decrypted=false" >> "$GITHUB_ENV"
          fi

      - name: Check for local audio files
        id: check
        run: |
          count=$(ls public/music/*.mp3 public/music/*.flac public/music/*.m4a public/music/*.wav public/music/*.ogg public/music/*.aac 2>/dev/null | wc -l)
          has_new=false
          [ "$count" -gt 0 ] && has_new=true
          echo "has_new=$has_new" >> "$GITHUB_OUTPUT"
          echo "Found $count local audio files"

      - name: Sync & verify from R2
        id: sync
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 sync-r2.py

      - name: Download current music_list.js from R2 (for merge)
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 本地没有 music_list.js 时从 R2 拉取（确保 merge 时保留已有歌曲）
          if [ ! -f scripts/music_list.js ]; then
            python3 -c "
import urllib.request, os, json
TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
AID = os.environ['CLOUDFLARE_ACCOUNT_ID']
BUCKET = 'maxcloud'
encoded = __import__('urllib.parse').quote('public/music/music_list.js', safe='')
url = f'https://api.cloudflare.com/client/v4/accounts/{AID}/r2/buckets/{BUCKET}/objects/{encoded}'
req = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}'})
try:
    resp = urllib.request.urlopen(req)
    text = resp.read().decode('utf-8')
    os.makedirs('scripts', exist_ok=True)
    with open('scripts/music_list.js', 'w', encoding='utf-8') as f:
        f.write(text)
    print('📥 Downloaded music_list.js from R2 for merge')
except Exception as e:
    print('⚠️  R2 music_list.js not found, starting fresh')
"
          fi

      - name: Install deps
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: npm install music-metadata

      - name: Generate music_list.js + extract covers + lyrics
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: node generate-music.js

      - name: Upload all files to R2
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TOKEN="$CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"

          # 静默安装 wrangler，失败不阻断
          npm install -g wrangler --silent 2>&1 | tail -1 || true

          upload() {
            local file="$1" ct="$2"
            # 避免 'file' 内含单引号破坏 python3 -c 的引用
            encoded=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "$file")
            local url="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${encoded}"
            http_code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${ct}" \
              --data-binary @"${file}" \
              "${url}")
            if [ "$http_code" != "200" ]; then
              wrangler r2 object put "${BUCKET}/${file}" --file="${file}" >/dev/null 2>&1 || true
            fi
            echo "  uploaded $file"
          }
          export -f upload
          export TOKEN ACCOUNT_ID BUCKET

          for ext in mp3:audio/mpeg flac:audio/flac m4a:audio/mp4 ogg:audio/ogg wav:audio/wav aac:audio/aac \
                     lrc:text/plain\;\ charset=utf-8 jpg:image/jpeg jpeg:image/jpeg png:image/png json:application/json; do
            ext_name="${ext%%:*}"
            content_type="${ext#*:}"
            for f in public/music/*."$ext_name"; do
              [ -f "$f" ] && upload "$f" "$content_type"
            done
          done

      - name: Upload music_list.js to R2
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 上传 music_list.js 到 R2，播放器通过 /public/music/* 代理读取
          python3 -c "
import urllib.request, json
with open('scripts/music_list.js','r') as f:
    data = f.read()
import os
TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
AID = os.environ['CLOUDFLARE_ACCOUNT_ID']
BUCKET = 'maxcloud'
encoded = __import__('urllib.parse').quote('public/music/music_list.js', safe='')
url = f'https://api.cloudflare.com/client/v4/accounts/{AID}/r2/buckets/{BUCKET}/objects/{encoded}'
req = urllib.request.Request(url, data=data.encode('utf-8'), method='PUT',
    headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/javascript'})
resp = urllib.request.urlopen(req)
print(f'  uploaded music_list.js ({resp.status})')
"

      - name: Clean repo — delete all audio/covers/lyrics/music_list
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: |
          # 全部文件已上传 R2，清理 repo 只留 .gitkeep
          rm -f public/music/*.mp3 public/music/*.MP3
          rm -f public/music/*.flac public/music/*.FLAC
          rm -f public/music/*.m4a
          rm -f public/music/*.ogg
          rm -f public/music/*.wav
          rm -f public/music/*.aac
          rm -f public/music/*.jpg public/music/*.jpeg
          rm -f public/music/*.png
          rm -f public/music/*.lrc
          rm -f scripts/music_list.js

      - name: Commit cleanup (music_list.js deleted, .gitkeep retained)
        if: steps.check.outputs.has_new == 'true' || steps.sync.outputs.synced == 'true' || env.kgm_decrypted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          touch public/music/.gitkeep
          git add public/music/.gitkeep
          git add -A
          git diff --cached --quiet || git commit -m "cleanup: remove processed files from repo [skip ci]"
          git push

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        uses: actions/deploy-pages@v4
